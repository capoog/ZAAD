<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style></head><body>
<title>الحق الكود</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: "lantern night" — a deep night ground lit by warm saffron and coral glows.
   Screen = side panel (brand, steps, live counter, prizes) + stage of floating gift-tag QR cards.
   Dashboard = top bar, KPI row, redeem + chart, prize editor, winners log, settings.
   Phone = one wrapped gift the customer opens with a tap. */
:root{
  --night:#0a1022;
  --night-2:#101834;
  --panel:#141e3f;
  --panel-2:#1b2750;
  --line:rgba(170,190,255,.13);
  --line-strong:rgba(170,190,255,.24);
  --saffron:#ffb547;
  --coral:#ff6f61;
  --cream:#fff6e6;
  --on-cream:#1b1633;
  --text:#eef1fb;
  --dim:#a6afcc;
  --faint:#6f7a9e;
  --good:#47d99b;
  --bad:#ff6b81;
  --font-display:'Alexandria','IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r-l:22px;--r-m:14px;--r-s:10px;
  color-scheme:dark;
}
html,body,#app{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--font-body);direction:rtl;-webkit-font-smoothing:antialiased;overflow:hidden}
body.scroll{overflow:auto}
body.scroll #app{height:auto;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;letter-spacing:.06em}
.ic{width:1em;height:1em;flex:none}

/* ---------- shared pieces ---------- */
.mark{width:44px;aspect-ratio:1;border-radius:13px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,var(--saffron),var(--coral));color:var(--night);box-shadow:0 10px 30px -12px rgba(255,140,80,.7)}
.mark svg{width:58%;height:58%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;
  background:var(--saffron);color:var(--night);text-decoration:none;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.soft{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
.btn.soft:hover{border-color:var(--line-strong)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,107,129,.35)}
.btn.danger.armed{background:var(--bad);color:var(--night)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .ic{font-size:16px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.on{color:var(--good)} .pill.on .dot{background:var(--good);box-shadow:0 0 0 3px rgba(71,217,155,.18)}
.pill.off .dot{background:var(--saffron)}
.pill.ok{color:var(--good)} .pill.wait{color:var(--saffron)} .pill.bad{color:var(--bad)} .pill.demo{color:var(--dim)}

/* gift box (screen reveal + phone) */
.gift{position:relative;width:var(--gs,240px);height:calc(var(--gs,240px) * 1.05);margin-inline:auto}
.gift .prize-pop{position:absolute;left:50%;bottom:22%;width:62%;aspect-ratio:1;transform:translate(-50%,30%) scale(.6);opacity:0;z-index:1;
  border-radius:24%;display:grid;place-items:center;background:var(--cream);color:var(--on-cream);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.gift .prize-pop svg{width:56%;height:56%}
.gift .prize-pop img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.gift .base{position:absolute;inset:auto 8% 0 8%;height:46%;border-radius:10% 10% 14% 14%;z-index:2;
  background:linear-gradient(180deg,var(--coral),#e2475a);box-shadow:inset 0 -12px 0 rgba(0,0,0,.12)}
.gift .base::after{content:"";position:absolute;inset:0 43%;background:var(--saffron)}
.gift .lid{position:absolute;inset:auto 2% 44% 2%;height:17%;border-radius:12px;z-index:3;transform-origin:15% 100%;
  background:linear-gradient(180deg,#ff8676,var(--coral));box-shadow:0 8px 0 rgba(0,0,0,.12)}
.gift .lid::before{content:"";position:absolute;inset:0 44%;background:var(--saffron)}
.gift .lid::after{content:"";position:absolute;left:50%;bottom:92%;width:46%;height:70%;transform:translateX(-50%);
  background:radial-gradient(closest-side at 28% 60%,transparent 45%,var(--saffron) 47%,var(--saffron) 70%,transparent 72%),radial-gradient(closest-side at 72% 60%,transparent 45%,var(--saffron) 47%,var(--saffron) 70%,transparent 72%)}
.gift.wobble{animation:wobble 2.6s ease-in-out infinite}
.gift.shake .lid{animation:jiggle .5s ease-in-out infinite}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}85%{transform:rotate(-3deg)}90%{transform:rotate(2deg)}}
@keyframes jiggle{50%{transform:translateY(-8%) rotate(-3deg)}}
.gift.open .lid{animation:lidoff .9s cubic-bezier(.3,1.4,.5,1) forwards}
.gift.open .prize-pop{animation:popup 1s .35s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes lidoff{to{transform:translate(-30%,-150%) rotate(-28deg);opacity:0}}
@keyframes popup{to{transform:translate(-50%,-55%) scale(1);opacity:1}}

/* ---------- SCREEN ---------- */
.screen{position:relative;height:100%;display:grid;grid-template-columns:minmax(300px,27vw) 1fr;isolation:isolate;overflow:hidden;
  background:
    radial-gradient(60% 55% at 15% 105%,rgba(255,111,97,.22),transparent 70%),
    radial-gradient(45% 50% at 95% -5%,rgba(255,181,71,.16),transparent 70%),
    linear-gradient(180deg,var(--night-2),var(--night))}
.side{position:relative;z-index:2;display:flex;flex-direction:column;gap:clamp(14px,2.4vh,26px);min-height:0;
  padding:clamp(18px,3.2vh,40px) clamp(18px,2vw,34px);padding-right:max(clamp(18px,2vw,34px),env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(20,30,63,.82),rgba(14,21,46,.9));border-inline-end:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-family:var(--font-display);font-weight:700;font-size:clamp(18px,1.5vw,24px)}
.headline{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(30px,3.3vw,62px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.headline em{font-style:normal;color:var(--saffron);display:block}
.sub{margin:-6px 0 0;color:var(--dim);font-size:clamp(13px,1vw,17px);line-height:1.7}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;font-size:clamp(13px,.95vw,16px)}
.steps li span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-family:var(--font-display);font-weight:700;font-size:13px;
  background:rgba(255,181,71,.12);color:var(--saffron);border:1px solid rgba(255,181,71,.35)}
.counter{padding:16px 18px;border-radius:var(--r-l);background:var(--night);border:1px solid var(--line);display:grid;gap:10px}
.counter .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.counter .big{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,4.4vw,80px);line-height:.95;font-variant-numeric:tabular-nums}
.counter .lbl{color:var(--dim);font-size:13px;text-align:end}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--saffron));transition:width .8s ease}
.counter.bump .big{animation:bump .7s ease}
@keyframes bump{40%{transform:scale(1.12);color:var(--saffron)}}
.plist-h{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px;margin-bottom:-8px}
.plist{flex:1;min-height:0;overflow:hidden;position:relative;mask-image:linear-gradient(180deg,transparent,#000 5%,#000 86%,transparent)}
.plist .track{display:grid;gap:8px}
.plist.mq .track{animation:vmq var(--mq,40s) linear infinite}
@keyframes vmq{to{transform:translateY(-50%)}}
.prow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-m);background:rgba(255,255,255,.03);border:1px solid transparent}
.prow .tl{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);color:var(--saffron)}
.prow .tl svg{width:58%;height:58%}
.prow .tl img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.prow .nm{font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .mini{height:4px;border-radius:9px;background:var(--panel-2);margin-top:6px;overflow:hidden}
.prow .mini i{display:block;height:100%;background:var(--saffron);border-radius:9px}
.prow .ct{font-family:var(--font-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.prow.out{opacity:.4}
.prow.out .ct{font-size:12px;color:var(--faint);font-family:var(--font-body)}
.prow.hit{border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.08)}

.stage{position:relative;z-index:0;overflow:hidden;min-width:0}
.stage-chip{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:600;display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;
  background:rgba(10,16,34,.7);border:1px solid var(--line-strong);font-family:var(--font-display);font-weight:600;font-size:clamp(13px,1.1vw,18px);white-space:nowrap;transition:opacity .6s,transform .6s}
.stage-chip .ic{color:var(--coral)}
.stage-chip.dim{opacity:0;transform:translate(-50%,-10px)}
.tag{position:absolute;left:0;top:0;width:var(--qs);padding:calc(var(--qs) * .075) calc(var(--qs) * .075) calc(var(--qs) * .05);box-sizing:border-box;border:0;
  background:var(--cream);color:var(--on-cream);border-radius:calc(var(--qs) * .1);will-change:transform,opacity;cursor:pointer;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.4)}
.tag::before{content:"";position:absolute;top:calc(var(--qs) * -.035);left:50%;width:calc(var(--qs) * .16);height:calc(var(--qs) * .07);transform:translateX(-50%);
  border-radius:99px 99px 0 0;background:var(--saffron)}
.tag canvas{width:100%;aspect-ratio:1;display:block;image-rendering:pixelated;border-radius:calc(var(--qs) * .03)}
.tag .cap{display:flex;align-items:center;justify-content:center;gap:.35em;padding-top:calc(var(--qs) * .045);font-family:var(--font-display);font-weight:700;font-size:calc(var(--qs) * .085);line-height:1}
.tag .cap .ic{color:var(--coral)}
.tag.scanning{box-shadow:0 0 0 calc(var(--qs) * .03) var(--saffron),0 0 60px 10px rgba(255,181,71,.5)}
.tag.pop{animation:tagout .8s ease forwards}
@keyframes tagout{to{opacity:0;filter:blur(8px)}}

.toast{position:absolute;top:22px;right:22px;z-index:700;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r-m);
  background:var(--panel);border:1px solid rgba(255,181,71,.45);font-size:clamp(13px,1vw,16px);box-shadow:0 20px 50px -20px rgba(0,0,0,.8);
  transform:translateY(-140%);opacity:0;transition:transform .5s cubic-bezier(.2,1.2,.4,1),opacity .4s}
.toast.show{transform:none;opacity:1}
.toast .ring{width:12px;height:12px;border-radius:50%;background:var(--saffron);animation:ping 1.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,181,71,.6)}100%{box-shadow:0 0 0 14px rgba(255,181,71,0)}}

.ticker{position:absolute;inset:auto 0 0 0;z-index:600;display:flex;align-items:center;gap:14px;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(10,16,34,.95),rgba(10,16,34,0));font-size:clamp(12px,.95vw,15px)}
.ticker .hd{flex:none;display:flex;align-items:center;gap:8px;color:var(--saffron);font-family:var(--font-display);font-weight:600}
.ticker .rail{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .run{display:flex;gap:28px;width:max-content}
.ticker.mq .run{animation:hmq var(--mq,30s) linear infinite}
@keyframes hmq{to{transform:translateX(50%)}}
.ticker .it{display:flex;align-items:center;gap:8px;color:var(--dim);white-space:nowrap}
.ticker .it b{color:var(--text);font-weight:600}
.ticker .it .ic{color:var(--coral)}
.ticker .conn{flex:none}

.tools{position:absolute;top:18px;left:18px;z-index:800;display:flex;gap:8px;transition:opacity .4s}
.tools.idle{opacity:0;pointer-events:none}

.reveal{position:absolute;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(55% 60% at 50% 42%,rgba(255,181,71,.28),transparent 70%),radial-gradient(80% 80% at 50% 50%,#1a2350,var(--night))}
.reveal .confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rv{position:relative;display:grid;justify-items:center;gap:clamp(6px,1.4vh,16px);text-align:center;padding-inline:16px;max-width:100%}
.rv .gift{--gs:clamp(170px,24vh,290px)}
.rv .eyebrow{font-size:clamp(13px,1.1vw,17px);color:var(--dim)}
.rv h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(48px,7.4vw,140px);line-height:1.1;letter-spacing:-.01em;
  background:linear-gradient(90deg,var(--saffron),#ffe2a8,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.rv .won{margin:0;font-family:var(--font-display);font-weight:600;font-size:clamp(22px,2.6vw,48px)}
.rv .won b{color:var(--saffron);font-weight:800}
.rv .claim{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;color:var(--dim);font-size:clamp(13px,1.1vw,18px)}
.rv .claim .mono{color:var(--text);font-size:clamp(16px,1.5vw,24px);padding:6px 14px;border-radius:10px;background:var(--panel);border:1px dashed var(--line-strong)}
.rv .timer{width:min(420px,70vw);height:4px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin-top:8px}
.rv .timer i{display:block;height:100%;background:var(--saffron);transform-origin:right;animation:drain var(--t,10s) linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.rv>.eyebrow,.rv>h2,.rv>.won,.rv>.claim{animation:rise .8s cubic-bezier(.2,1.2,.4,1) backwards}
.rv>.eyebrow{animation-delay:.9s}.rv>h2{animation-delay:1s}.rv>.won{animation-delay:1.15s}.rv>.claim{animation-delay:1.3s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}

/* ---------- PHONE ---------- */
.phone{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:grid;place-items:center;position:relative;overflow:hidden;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(80% 50% at 50% 35%,rgba(255,181,71,.22),transparent 70%),linear-gradient(180deg,var(--night-2),var(--night))}
.phone .confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.pc{width:min(420px,100%);display:grid;justify-items:center;gap:16px;text-align:center}
.pc h1{margin:4px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1.2;text-wrap:balance}
.pc h1 em{font-style:normal;color:var(--saffron)}
.pc p{margin:0;color:var(--dim);line-height:1.75;max-width:34ch}
.pc .gift{--gs:min(62vw,250px);margin-block:6px}
.pc .gift.open{--gs:min(52vw,210px);margin-top:calc(var(--gs) * .5)}
.pc .btn.big{font-size:18px;padding:16px 34px;border-radius:16px;font-family:var(--font-display);box-shadow:0 18px 40px -14px rgba(255,181,71,.6)}
.ticket{position:relative;width:100%;box-sizing:border-box;padding:18px;border-radius:var(--r-l);background:var(--cream);color:var(--on-cream);display:grid;gap:6px;
  -webkit-mask:radial-gradient(circle 12px at 0 64%,transparent 98%,#000),radial-gradient(circle 12px at 100% 64%,transparent 98%,#000);-webkit-mask-composite:source-in;
  mask:radial-gradient(circle 12px at 0 64%,transparent 98%,#000),radial-gradient(circle 12px at 100% 64%,transparent 98%,#000);mask-composite:intersect}
.ticket .lbl{font-size:13px;color:#6a6488}
.ticket .pn{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.3}
.ticket hr{border:0;border-top:2px dashed rgba(27,22,51,.18);margin:8px 6px;width:calc(100% - 12px)}
.ticket .mono{font-size:26px;font-weight:600;letter-spacing:.14em}
.ticket .t{font-size:12px;color:#6a6488;font-variant-numeric:tabular-nums}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(1turn)}}

/* ---------- DASHBOARD ---------- */
.dash{min-height:100%;box-sizing:border-box;background:linear-gradient(180deg,var(--night-2),var(--night) 420px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body.scroll::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night-2)}
.wrap{max-width:1240px;margin-inline:auto;display:grid;gap:18px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding-block:14px;
  background:rgba(16,24,52,.92);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px))}
.topbar .brand{flex:1;min-width:0}
.topbar .brand div{display:grid;min-width:0}
.topbar .brand small{color:var(--dim);font-size:12.5px}
.topbar .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;border-radius:var(--r-l);background:var(--panel);border:1px solid var(--line);display:grid;gap:4px;min-width:0}
.kpi .k{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:8px}
.kpi .k .ic{color:var(--saffron)}
.kpi .v{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3vw,40px);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{color:var(--faint);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px}
.card{padding:20px;border-radius:var(--r-l);background:var(--panel);border:1px solid var(--line);display:grid;gap:14px;align-content:start;min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.card-h h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:18px}
.card-h p{margin:2px 0 0;color:var(--dim);font-size:13px}
.field{display:grid;gap:6px;font-size:13px;color:var(--dim);min-width:0}
.in{background:var(--night);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;color:var(--text);width:100%;box-sizing:border-box;min-width:0}
.in:focus{border-color:rgba(255,181,71,.6);outline:none;box-shadow:0 0 0 3px rgba(255,181,71,.15)}
.in.code{font-family:var(--font-mono);direction:ltr;text-transform:uppercase;letter-spacing:.1em;font-size:18px;text-align:center}
.redeem-form{display:flex;gap:8px}
.redeem-form .in{flex:1}
.result{border-radius:var(--r-m);padding:16px;background:var(--night);border:1px solid var(--line);display:grid;gap:10px;justify-items:start}

function makeLink(server, topic, onMsg, onStatus){
  const seen = new Set(); let closed = false;
  const deliver = o => { if (closed || !o || !o.mid || seen.has(o.mid)) return; seen.add(o.mid); onMsg(o); };
  let bc = null; try { bc = new BroadcastChannel('hd-' + topic); bc.onmessage = e => deliver(e.data); } catch {}
  let es = null, open = false;
  const base = String(server || DEFAULTS.server).replace(/\/$/, '');
  try {
    es = new EventSource(`${base}/${encodeURIComponent(topic)}/sse`);
    es.onmessage = e => { try { const d = JSON.parse(e.data); if (d.event === 'open'){ open = true; onStatus && onStatus(true); } else if (d.event === 'message' && d.message) deliver(JSON.parse(d.message)); } catch {} };
    es.onopen = () => { open = true; onStatus && onStatus(true); };
    es.onerror = () => { open = false; onStatus && onStatus(false); };
  } catch { onStatus && onStatus(false); }
  return {
    get online(){ return open; },
    send(o){ o.mid = o.mid || rand(10); seen.add(o.mid); try { bc && bc.postMessage(o); } catch {}
      return fetch(`${base}/${encodeURIComponent(topic)}`, { method:'POST', body: JSON.stringify(o) }).then(r => r.ok).catch(() => false); },
    close(){ closed = true; try { es && es.close(); } catch {} try { bc && bc.close(); } catch {} },
  };
}

const giftHTML = (prize, cls='') => `<div class="gift ${cls}"><div class="prize-pop">${pIcon(prize)}</div><div class="base"></div><div class="lid"></div></div>`;
const brandHTML = name => `<div class="brand"><span class="mark">${svg(ICONS.gift[1], '')}</span><b>${esc(name)}</b></div>`;

/* ================================================================
   SCREEN — the codes wall
   ================================================================ */
function screenView(app, dispose){
  document.body.className = '';
  let s = Engine.init();
  const baseURL = () => (s.cfg.pageURL || (location.origin + location.pathname)).replace(/[?#].*$/, '');
  const urlFor = g => `${baseURL()}?g=${g}&t=${s.topic}` + (s.cfg.server !== DEFAULTS.server ? `&s=${encodeURIComponent(s.cfg.server)}` : '');

  app.innerHTML = `
  <main class="screen">
    <aside class="side">
      <div id="brand"></div>
      <h1 class="headline"><span id="t1"></span> <em id="t2"></em></h1>
      <p class="sub" id="sub"></p>
      <ol class="steps">
        <li><span>1</span>افتح كاميرا جوالك</li>
        <li><span>2</span>صوّر أي كود على الشاشة</li>
        <li><span>3</span>افتح الهدية واستلمها من الكاشير</li>
      </ol>
      <div class="counter" id="counter">
        <div class="top"><span class="big" id="left">0</span><span class="lbl">هدية لسه<br>مستنية صاحبها</span></div>
        <div class="bar"><i id="leftBar"></i></div>
      </div>
      <div class="plist-h"><span>الهدايا</span><span>المتبقي</span></div>
      <div class="plist" id="plist"><div class="track" id="ptrack"></div></div>
    </aside>
    <section class="stage" id="stage" aria-label="أكواد الهدايا">
      <div class="stage-chip dim" id="chip"></div>
      <div class="toast" id="toast"><span class="ring"></span><span>في حد بيفتح هديته دلوقتي...</span></div>
      <div class="tools idle" id="tools">
        <a class="btn soft" href="#dashboard">${ui('grid')} لوحة التحكم</a>
        <button class="btn soft" id="fs" type="button">${ui('expand')} ملء الشاشة</button>
      </div>
      <div class="ticker" id="ticker">
        <div class="hd">${ui('gift')}<span>آخر الفائزين</span></div>
        <div class="rail"><div class="run" id="run"></div></div>
        <span class="pill conn off" id="conn"><span class="dot"></span><span>جارٍ الاتصال</span></span>
      </div>
    </section>
    <div class="reveal" id="reveal" hidden><canvas class="confetti" id="cf"></canvas><div class="rv" id="rv"></div></div>
  </main>`;

  /* -- side panel -- */
  function paintSide(hitId){
    $('#brand').innerHTML = brandHTML(s.cfg.store);
    $('#t1').textContent = s.cfg.title; $('#t2').textContent = s.cfg.titleAccent; $('#sub').textContent = s.cfg.subtitle;
    const t = totals(s);
    $('#left').textContent = fmt(t.left);
    $('#leftBar').style.width = (t.total ? t.left / t.total * 100 : 0) + '%';
    const rows = s.cfg.prizes.map(p => `<div class="prow ${p.left > 0 ? '' : 'out'} ${p.id === hitId ? 'hit' : ''}">
      <div class="tl">${pIcon(p)}</div>
      <div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="mini"><i style="width:${p.total ? p.left / p.total * 100 : 0}%"></i></div></div>
      <div class="ct">${p.left > 0 ? fmt(p.left) : 'خلصت'}</div></div>`).join('');
    const box = $('#plist'), track = $('#ptrack');
    track.innerHTML = rows; box.classList.remove('mq');
    requestAnimationFrame(() => { if (track.scrollHeight > box.clientHeight + 4){ track.innerHTML = rows + rows; box.classList.add('mq'); box.style.setProperty('--mq', s.cfg.prizes.length * 4 + 's'); } });
  }
  function bumpCounter(){ const c = $('#counter'); c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
  function paintTicker(){
    const ws = s.winners.slice(0, 12);
    const items = ws.length ? ws.map(w => `<span class="it">${ui('gift')}<b>${esc(w.name)}</b><span class="mono">${esc(w.code)}</span><span>${timeAgo(w.at)}</span></span>`).join('')
      : `<span class="it">${ui('heart')}<span>ولا هدية اتفتحت لسه. <b>كن أول فائز!</b></span></span>`;
    const tk = $('#ticker'), run = $('#run'); run.innerHTML = items; tk.classList.remove('mq');
    requestAnimationFrame(() => { const rail = run.parentElement; if (run.scrollWidth > rail.clientWidth){ run.innerHTML = items + items; tk.classList.add('mq'); tk.style.setProperty('--mq', ws.length * 6 + 's'); } });
  }

  /* -- stage -- */
  const stage = $('#stage'), sprites = new Map();
  let W = 0, Hh = 0, mode = 'drift', modeAt = performance.now(), cycle = 0, raf = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const measure = () => { W = stage.clientWidth; Hh = stage.clientHeight; };
  const formations = [['heart', 'هدايا من القلب', 'heart'], ['ring', 'كل كود وراه مفاجأة', 'gift']];
  function target(k, n){
    const cx = W/2, cy = Hh * .47, R = Math.min(W, Hh) * .36;
    if (mode === 'heart'){ const t = k / n * Math.PI * 2, sc = R / 16.5;
      return { x: cx + 16 * Math.sin(t) ** 3 * sc, y: cy + 1.5 * sc - (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * sc }; }
    const t = k / n * Math.PI * 2 - Math.PI / 2; return { x: cx + Math.cos(t) * R * 1.1, y: cy + Math.sin(t) * R };
  }
  function sync(){
    for (const [g, sp] of sprites) if (!s.live.includes(g) && !sp.leaving){ sp.leaving = true; sp.el.classList.add('pop'); setTimeout(() => { sp.el.remove(); sprites.delete(g); }, 800); }
    for (const g of s.live){
      if (sprites.has(g)) continue;
      const el = document.createElement('button'); el.type = 'button'; el.className = 'tag'; el.setAttribute('aria-label', 'كود هدية — اضغط للتجربة');
      el.appendChild(qrCanvas(urlFor(g)));
      el.insertAdjacentHTML('beforeend', `<div class="cap">${ui('scan')}امسحني</div>`);
      el.addEventListener('click', () => demoReveal(g));
      stage.insertBefore(el, $('#ticker'));
      sprites.set(g, { el, g, x: .1 + Math.random() * .8, y: .12 + Math.random() * .66, vx:(Math.random()-.5) * .02, vy:(Math.random()-.5) * .016,
        s: .78 + Math.random() * .38, rot:(Math.random()-.5) * 12, px: W/2, py: Hh/2, ps:.3, pr:0, op:0 });
    }
  }
  let last = performance.now();
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!reduce){
      const ph = (now - modeAt) / 1000;
      if (mode === 'drift' && ph > 15){ const f = formations[cycle++ % formations.length]; mode = f[0]; modeAt = now; $('#chip').innerHTML = `${ui(f[2])}${esc(f[1])}`; $('#chip').classList.remove('dim'); }
      else if (mode !== 'drift' && ph > 8){ mode = 'drift'; modeAt = now; $('#chip').classList.add('dim'); }
    }
    const base = Math.min(W, Hh) * .19, small = Math.min(W, Hh) * .088;
    const list = [...sprites.values()].filter(x => !x.leaving);
    list.forEach((sp, k) => {
      sp.x += sp.vx * dt * (reduce ? .1 : 1); sp.y += sp.vy * dt * (reduce ? .1 : 1);
      if (sp.x < .07 || sp.x > .93) sp.vx *= -1; if (sp.y < .1 || sp.y > .78) sp.vy *= -1;
      sp.x = Math.min(.93, Math.max(.07, sp.x)); sp.y = Math.min(.78, Math.max(.1, sp.y));
      let tx = sp.x * W, ty = sp.y * Hh, ts = sp.s, tr = sp.rot;
      if (mode !== 'drift'){ const p = target(k, list.length); tx = p.x; ty = p.y; ts = small / base; tr = 0; }
      const e = mode === 'drift' ? .035 : .06;
      sp.px += (tx - sp.px) * e; sp.py += (ty - sp.py) * e; sp.ps += (ts - sp.ps) * e; sp.pr += (tr - sp.pr) * e; sp.op += (1 - sp.op) * .05;
      sp.el.style.setProperty('--qs', base + 'px');
      sp.el.style.transform = `translate(${sp.px - base/2}px, ${sp.py - base * .59}px) rotate(${sp.pr}deg) scale(${sp.ps})`;
      sp.el.style.opacity = (mode === 'drift' ? .6 + sp.s * .35 : 1) * sp.op;
      sp.el.style.zIndex = Math.round(sp.s * 100);
    });
    raf = requestAnimationFrame(frame);
  }

  /* -- "someone is opening a gift" -- */
  let toastT = 0;
  function scanning(g){
    const sp = sprites.get(g); if (sp){ sp.el.classList.add('scanning'); setTimeout(() => sp.el.classList.remove('scanning'), 9000); }
    const t = $('#toast'); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 7000);
  }

  /* -- reveal -- */
  const queue = []; let showing = false, revealT = 0;
  function reveal(w, demo){
    queue.push({ w, demo }); if (showing) return;
    (function next(){
      const item = queue.shift(); if (!item){ showing = false; return; }
      showing = true; $('#toast').classList.remove('show');
      const secs = s.cfg.revealSeconds;
      $('#rv').innerHTML = `${giftHTML(item.w, 'open')}
        <div class="eyebrow">${item.demo ? 'تجربة · ' : ''}صاحب الكود <span class="mono">${esc(item.w.code)}</span></div>
        <h2>مبروووك!</h2>
        <p class="won">كسبت <b>${esc(item.w.name)}</b></p>
        <div class="claim">استلم هديتك من الكاشير بالكود <span class="mono">${esc(item.w.code)}</span></div>
        <div class="timer" style="--t:${secs}s"><i></i></div>`;
      $('#reveal').hidden = false; confetti($('#cf'), 700); setTimeout(chime, 500);
      revealT = setTimeout(() => { $('#reveal').hidden = true; bumpCounter(); next(); }, secs * 1000);
    })();
  }
  function demoReveal(g){
    const p = parseG(g, s.topic), pr = p && prizeById(s, p.pid); if (!pr) return;
    reveal({ code: codeOf(p.n), name: pr.name, icon: pr.icon, img: pr.img }, true);
  }

  /* -- messaging -- */
  const setConn = on => { const c = $('#conn'); if (!c) return; c.className = 'pill conn ' + (on ? 'on' : 'off'); c.lastElementChild.textContent = on ? 'متصلة' : 'غير متصلة'; };
  const pub = makeLink(s.cfg.server, s.topic, msg => {
    if (msg.type === 'scan'){ Engine.mutate(st => { const cut = Date.now() - 864e5; st.scans = st.scans.filter(t => t > cut).slice(-3000); st.scans.push(Date.now()); }); scanning(msg.g); }
    if (msg.type === 'claim'){
      const [ns, r] = Engine.mutate(st => opClaim(st, msg.g)); s = ns;
      pub.send({ type:'ack', n: r.n || '', ok: r.ok, reason: r.reason || '', prize: r.prize || null });
      if (r.ok){ sync(); paintSide(r.winner.pid); paintTicker(); reveal(r.winner, false); pushSnap(); }
    }
  }, setConn);
  const adm = makeLink(s.cfg.server, adminTopic(s), msg => {
    if (msg.type !== 'cmd') return;
    let r = null;
    if (msg.op === 'config') [s, r] = Engine.mutate(st => opConfig(st, msg.cfg));
    else if (msg.op === 'redeem') [s, r] = Engine.mutate(st => opRedeem(st, msg.code));
    else if (msg.op === 'lookup') r = opLookup(s = Engine.load(), msg.code);
    else if (msg.op === 'campaign') [s, r] = Engine.mutate(opNewCampaign);
    else if (msg.op === 'demo'){ s = Engine.load(); if (s.live[0]) demoReveal(s.live[0]); r = { ok:true }; }
    adm.send({ type:'reply', rid: msg.rid, r });
    refresh(); pushSnap();
  });
  function pushSnap(){ adm.send({ type:'snap', snap: snapshot(s) }); }

  function refresh(){
    const before = s.cfg.server + s.topic;
    s = Engine.load() || s;
    if (s.cfg.server + s.topic !== before){ route(); return; }
    sync(); paintSide(); paintTicker();
  }
  const onStorage = e => { if (e.key === KEY) refresh(); };
  addEventListener('storage', onStorage);

  /* -- tools auto-hide, fullscreen, keep awake -- */
  let idleT = 0;
  const wake = () => { const t = $('#tools'); if (!t) return; t.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => t.classList.add('idle'), 3500); };
  addEventListener('pointermove', wake); wake();
  $('#fs').onclick = async () => { try { document.fullscreenElement ? await document.exitFullscreen() : await document.documentElement.requestFullscreen(); } catch {} try { await navigator.wakeLock?.request('screen'); } catch {} };

  const ro = new ResizeObserver(measure); ro.observe(stage);
  measure(); paintSide(); paintTicker(); sync();
  raf = requestAnimationFrame(frame);
  const tickT = setInterval(paintTicker, 60000);
  const beatT = setInterval(pushSnap, 30000); const firstSnap = setTimeout(pushSnap, 1500);
  const offT = setTimeout(() => { if (!pub.online) setConn(false); }, 6000);
  dispose.add(() => { cancelAnimationFrame(raf); ro.disconnect(); pub.close(); adm.close(); removeEventListener('storage', onStorage); removeEventListener('pointermove', wake);
    [tickT, beatT].forEach(clearInterval); [offT, revealT, toastT, idleT, firstSnap].forEach(clearTimeout); });
}

/* ================================================================
   PHONE — what the customer sees after scanning
   ================================================================ */
function phoneView(app, dispose, params, demo){
  document.body.className = 'scroll';
  let g = params.get('g'), topic = params.get('t') || '', server = params.get('s') || DEFAULTS.server, store = DEFAULTS.store, simulate = false;
  const st0 = Engine.load();
  if (demo){ if (st0 && st0.live.length){ g = st0.live[0]; topic = st0.topic; server = st0.cfg.server; store = st0.cfg.store; } else simulate = true; }
  else if (st0 && st0.topic === topic) store = st0.cfg.store;
  const parsed = simulate ? { n:'demo42' } : parseG(g, topic);
  const code = parsed ? codeOf(parsed.n) : '';

  const shell = inner => { app.innerHTML = `<main class="phone"><canvas class="confetti"></canvas><section class="pc">${brandHTML(store)}${inner}</section></main>`; };
  if (!parsed){ shell(`<h1>الكود ده <em>مش شغال</em></h1><p>جرّب تصوّر كود تاني من الشاشة. الأكواد بتتجدد كل شوية.</p>`); return; }

  const showWon = (prize, state) => {
    const msg = { ok:['ok','اتأكدت من الشاشة'], demo:['demo','معاينة'] }[state];
    shell(`
      ${giftHTML(prize, 'open')}
      <h1>مبروووك! <em>الهدية ليك</em></h1>
      <div class="ticket">
        <span class="lbl">هديتك</span><span class="pn">${esc(prize.name)}</span>
        <hr><span class="lbl">كود الاستلام</span><span class="mono">${esc(code)}</span>
        <span class="t">${new Date().toLocaleString('ar-EG', { dateStyle:'medium', timeStyle:'short' })}</span>
      </div>
      <p>اعرض الكود ده على الكاشير عشان تستلم هديتك. خد سكرين شوت للاحتياط.</p>
      <span class="pill ${msg[0]}">${state === 'ok' ? ui('check') : ''}${msg[1]}</span>`);
    confetti($('.confetti', app), 900);
  };
  const showUsed = () => shell(`<h1>الكود ده <em>اتفتح قبلك</em></h1><p>حد سبقك على الكود ده. صوّر كود تاني من الشاشة، لسه فيه هدايا كتير.</p><span class="pill bad">الكود مستخدم</span>`);
  const showClosed = () => shell(`
    <h1>لقيت <em>هدية!</em></h1>
    <p>الهدية دي مستنياك. أول ما تفتحها هتظهر كمان على شاشة المحل.</p>
    ${giftHTML({ icon:'gift' }, 'wobble')}
    <button class="btn big" id="open" type="button">${ui('hand')} افتح الهدية</button>
    <span class="pill" id="st"><span class="dot"></span><span>كود <span class="mono">${esc(code)}</span></span></span>`);

  const memoKey = 'hd-claim-' + parsed.n;
  let memo = null; try { memo = JSON.parse(localStorage.getItem(memoKey)); } catch {}
  if (memo && !simulate){ memo.ok ? showWon(memo.prize, 'ok') : showUsed(); return; }
  showClosed();

  if (simulate){
    $('#open').onclick = () => { $('.gift', app).className = 'gift shake'; setTimeout(() => showWon({ name: DEFAULTS.prizes[1][0], icon: DEFAULTS.prizes[1][1] }, 'demo'), 1200); };
    return;
  }
  let acked = false, timer = 0, scanned = false;
  const link = makeLink(server, topic, msg => {
    if (msg.type !== 'ack' || msg.n !== parsed.n || acked) return;
    acked = true; clearTimeout(timer);
    try { localStorage.setItem(memoKey, JSON.stringify({ ok: msg.ok, prize: msg.prize })); } catch {}
    setTimeout(() => msg.ok ? showWon(msg.prize, 'ok') : showUsed(), 900);
  }, on => { if (on && !scanned){ scanned = true; link.send({ type:'scan', g }); } });
  const scanT = setTimeout(() => { if (!scanned){ scanned = true; link.send({ type:'scan', g }); } }, 1500);
  const claim = () => {
    const st = $('#st'); if (st){ st.className = 'pill wait'; st.innerHTML = `<span class="spin"></span><span>بنفتحها...</span>`; }
    link.send({ type:'claim', g });
    timer = setTimeout(() => { if (acked) return;
      shell(`<h1>مش قادرين <em>نوصل للشاشة</em></h1><p>اتأكد إن النت شغال عندك وجرّب تاني. الكود لسه بتاعك لحد ما حد يفتحه.</p>
        <span class="pill"><span class="mono">${esc(code)}</span></span><button class="btn big" id="retry" type="button">جرّب تاني</button>`);
      $('#retry').onclick = () => { shell(`<h1>بنحاول <em>تاني...</em></h1>${giftHTML({ icon:'gift' }, 'shake')}<span class="pill wait" id="st"><span class="spin"></span><span>بنتأكد...</span></span>`); claim(); };
    }, 10000);
  };
  $('#open').onclick = () => { $('#open').disabled = true; $('.gift', app).className = 'gift shake'; claim(); };
  dispose.add(() => { link.close(); clearTimeout(timer); clearTimeout(scanT); });
}

        <label class="field">العنوان (السطر الملوّن)<input class="in" id="sAccent"></label>
        <label class="field">الوصف<input class="in" id="sSub"></label>
        <label class="field">عدد الأكواد على الشاشة<input class="in" id="sCodes" type="number" min="4" max="60" inputmode="numeric"></label>
        <label class="field">مدة شاشة الفوز (ثانية)<input class="in" id="sSecs" type="number" min="4" max="40" inputmode="numeric"></label>
        <label class="field">رابط الصفحة بعد الرفع<input class="in" id="sUrl" dir="ltr" placeholder="https://..."></label>
        <label class="field">خادم الربط<input class="in" id="sServer" dir="ltr"></label>
      </form>
      <div class="savebar"><span class="dirty" id="sDirty"></span><button class="btn" id="saveS" type="button" disabled>حفظ الإعدادات</button></div>
      <div class="field">رابط لوحة التحكم من جهاز تاني (لموبايل الكاشير)
        <div class="copyrow"><input class="in" id="pairUrl" readonly aria-label="رابط لوحة التحكم"><button class="btn soft" id="copyPair" type="button">${ui('copy')} نسخ</button></div>
      </div>
      <p class="help">الرابط ده فيه مفتاح خاص بيك، ما تنشرهوش. الشاشة لازم تكون مفتوحة عشان الكاشير يقدر يسلّم الهدايا من جهاز تاني.</p>
      <div class="savebar"><p class="help">حملة جديدة: ترجّع كل الكميات لأولها وتمسح سجل الفائزين.</p><button class="btn danger" id="campaign" type="button">بدء حملة جديدة</button></div>
    </section>
  </div></main>
  <div class="flash" id="flash"></div>`;

  let flashT = 0;
  const flash = t => { const f = $('#flash'); f.textContent = t; f.classList.add('show'); clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('show'), 2600); };

  /* -- data access: local, or through the screen -- */
  const adm = makeLink(server, remote ? `${pair[0]}-a-${pair[1]}` : adminTopic(s), msg => {
    if (msg.type === 'snap'){ lastSeen = Date.now(); paintTv(); if (remote){ snap = msg.snap; paintAll(); } }
    if (msg.type === 'reply' && pending.has(msg.rid)){ lastSeen = Date.now(); paintTv(); pending.get(msg.rid)(msg.r || {}); pending.delete(msg.rid); }
  });
  function cmd(op, extra){
    if (!remote){
      let r = { ok:true };
      if (op === 'config') [s, r] = Engine.mutate(st => opConfig(st, extra.cfg));
      else if (op === 'redeem') [s, r] = Engine.mutate(st => opRedeem(st, extra.code));
      else if (op === 'lookup') r = opLookup(s = Engine.load(), extra.code);
      else if (op === 'campaign') [s, r] = Engine.mutate(opNewCampaign);
      else if (op === 'demo') adm.send({ type:'cmd', op:'demo', rid: rand(8) });
      snap = snapshot(s); paintAll(); return Promise.resolve(r);
    }
    return new Promise(res => { const rid = rand(8); pending.set(rid, res); adm.send(Object.assign({ type:'cmd', op, rid }, extra));
      setTimeout(() => { if (pending.has(rid)){ pending.delete(rid); res({ timeout:true }); } }, 9000); });
  }
  const allWinners = () => snap ? (remote ? snap.winners : s.winners) : [];

  /* -- paint -- */
  function paintTv(){
    const on = Date.now() - lastSeen < 70000, p = $('#tvPill'); if (!p) return;
    p.className = 'pill ' + (on ? 'on' : 'off');
    p.lastElementChild.textContent = on ? 'الشاشة شغالة' : lastSeen ? `آخر ظهور للشاشة ${timeAgo(lastSeen)}` : 'الشاشة مش مفتوحة';
  }
  function paintKpis(){
    const t = snap.stats;
    const k = (icon, label, v, sub) => `<div class="kpi"><span class="k">${ui(icon)}${label}</span><span class="v">${v}</span><span class="s">${sub}</span></div>`;
    $('#kpis').innerHTML =
      k('gift', 'هدايا متبقية', fmt(t.left), `من ${fmt(t.total)} هدية`) +
      k('heart', 'اتكسبت', fmt(t.won), t.total ? `${Math.round(t.won / t.total * 100)}% من الهدايا` : '—') +
      k('check', 'اتسلمت', fmt(t.redeemed), 'استلمها أصحابها') +
      k('clock', 'مستنية الاستلام', fmt(t.pending), t.pending ? 'أصحابها لسه ما جوش' : 'كله اتسلم');
  }
  function paintChart(){
    const box = $('#chart'), hours = snap.hours, Wc = Math.max(280, box.clientWidth), Hc = 220, padT = 20, padB = 28, padR = 30;
    const max = Math.max(4, ...hours.map(h => h.wins)), nice = Math.ceil(max / 4) * 4;
    const plotW = Wc - padR - 4, slot = plotW / hours.length, bw = Math.min(24, slot * .55), y = v => padT + (Hc - padT - padB) * (1 - v / nice);
    // RTL: the oldest hour sits on the right, the newest on the left; the value axis sits on the right edge.
    const xAt = i => Wc - padR - slot * i - slot / 2;
    $('#todayPill').textContent = `${fmt(hours.reduce((a, h) => a + h.wins, 0))} فائز في 12 ساعة`;
    let g = '';
    for (let i = 0; i <= 4; i++){ const v = nice / 4 * i, yy = y(v);
      g += `<line x1="0" x2="${Wc - padR}" y1="${yy}" y2="${yy}" stroke="rgba(170,190,255,${i ? .09 : .26})" stroke-width="1"/><text x="${Wc - padR + 8}" y="${yy + 4}" fill="#6f7a9e" font-size="11" text-anchor="start" font-family="Alexandria">${fmt(v)}</text>`; }
    const peak = hours.reduce((m, h, i) => h.wins >= hours[m].wins ? i : m, 0);
    hours.forEach((h, i) => {
      const cx = xAt(i), top = y(h.wins), hgt = Hc - padB - top, r = Math.min(4, hgt / 2);
      if (h.wins > 0) g += `<path d="M${cx - bw/2} ${Hc - padB}V${top + r}q0 -${r} ${r} -${r}h${bw - 2*r}q${r} 0 ${r} ${r}V${Hc - padB}z" fill="#ffb547"/>`;
      if (i === peak && h.wins > 0) g += `<text x="${cx}" y="${top - 7}" fill="#eef1fb" font-size="12" text-anchor="middle" font-family="Alexandria" font-weight="600">${h.wins}</text>`;
      if ((hours.length - 1 - i) % 3 === 0) g += `<text x="${cx}" y="${Hc - 8}" fill="#6f7a9e" font-size="11" text-anchor="middle" font-family="Alexandria">${i === hours.length - 1 ? 'الساعة دي' : new Date(h.t).toLocaleTimeString('ar-EG', { hour:'numeric' })}</text>`;
      g += `<rect class="hit" data-i="${i}" x="${cx - slot/2}" y="${padT}" width="${slot}" height="${Hc - padT - padB}" fill="transparent"/>`;
    });
    const old = $('svg', box); old && old.remove();
    box.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${Wc} ${Hc}" role="img" aria-label="عدد الفائزين في كل ساعة">${g}</svg>`);
    const tip = $('#tip');
    box.querySelectorAll('.hit').forEach(r => {
      r.addEventListener('pointerenter', () => { const i = +r.dataset.i, h = hours[i];
        tip.innerHTML = `<b>${fmt(h.wins)} فائز</b>${new Date(h.t).toLocaleTimeString('ar-EG', { hour:'numeric', minute:'2-digit' })} · ${fmt(h.scans)} مرة مسح`;
        tip.style.left = (xAt(i) / Wc * box.clientWidth) + 'px'; tip.style.top = Math.max(30, y(h.wins)) + 'px'; tip.style.opacity = 1; r.setAttribute('fill', 'rgba(255,255,255,.04)'); });
      r.addEventListener('pointerleave', () => { tip.style.opacity = 0; r.setAttribute('fill', 'transparent'); });
    });
  }
  const iconOptions = sel => Object.entries(ICONS).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v[0]}</option>`).join('');
  function paintPrizes(){
    const rows = draft || snap.cfg.prizes;
    $('#pBody').innerHTML = rows.length ? rows.map((p, i) => `<tr data-i="${i}">
      <td><div class="pcell"><span class="tl">${pIcon(p)}</span><input class="in" data-k="name" value="${esc(p.name)}" aria-label="اسم الهدية"></div></td>
      <td><select class="in" data-k="icon" aria-label="الأيقونة">${iconOptions(p.icon)}</select></td>
      <td><input class="in" data-k="total" type="number" min="0" inputmode="numeric" value="${p.total}" style="width:90px" aria-label="الكمية الكلية"></td>
      <td><input class="in" data-k="left" type="number" min="0" inputmode="numeric" value="${p.left}" style="width:90px" aria-label="المتبقي"></td>
      <td><div class="stockbar"><div class="bar"><i style="width:${p.total ? Math.min(100, p.left / p.total * 100) : 0}%"></i></div><small>${p.left > 0 ? `${fmt(p.left)} من ${fmt(p.total)}` : 'خلصت'}</small></div></td>
      <td><button class="iconbtn" data-del="${i}" type="button" aria-label="حذف ${esc(p.name)}">${ui('trash')}</button></td></tr>`).join('')
      : `<tr class="empty-row"><td colspan="6">مفيش هدايا. اضغط «إضافة هدية» عشان تبدأ.</td></tr>`;
    $('#pDirty').textContent = draft ? 'فيه تغييرات لسه ما اتحفظتش' : '';
    $('#saveP').disabled = !draft || !draft.length;
  }
  function paintWinners(){
    const q = query.trim().toUpperCase();
    const all = allWinners();
    const list = all.filter(w => (filter === 'all' || (filter === 'done' ? w.redeemedAt : !w.redeemedAt)) && (!q || w.code.includes(q) || w.name.toUpperCase().includes(q))).slice(0, 200);
    $('#wNote').textContent = remote ? 'آخر 25 فائز (جاية من الشاشة)' : `${fmt(all.length)} فائز في الحملة دي`;
    $('#wBody').innerHTML = list.length ? list.map(w => `<tr>
      <td class="num">${clock(w.at)}<br><small style="color:var(--faint)">${new Date(w.at).toLocaleDateString('ar-EG', { day:'numeric', month:'short' })}</small></td>
      <td><span class="mono">${esc(w.code)}</span></td>
      <td><div class="pcell"><span class="tl">${pIcon(w)}</span>${esc(w.name)}</div></td>
      <td>${w.redeemedAt ? `<span class="pill ok">${ui('check')}اتسلمت ${clock(w.redeemedAt)}</span>` : `<span class="pill wait">مستنية</span>`}</td>
      <td>${w.redeemedAt ? '' : `<button class="btn soft" data-redeem="${esc(w.code)}" type="button">تسليم</button>`}</td></tr>`).join('')
      : `<tr class="empty-row"><td colspan="5">${all.length ? 'مفيش نتايج بالفلتر ده' : 'لسه مفيش فائزين. أول ما حد يفتح هدية هيظهر هنا.'}</td></tr>`;
  }
  function paintSettings(force){
    if (sDirty && !force) return;
    const c = snap.cfg;
    $('#sStore').value = c.store; $('#sTitle').value = c.title; $('#sAccent').value = c.titleAccent; $('#sSub').value = c.subtitle;
    $('#sCodes').value = c.liveCodes; $('#sSecs').value = c.revealSeconds; $('#sUrl').value = c.pageURL; $('#sUrl').placeholder = location.origin + location.pathname; $('#sServer').value = c.server;
    const base = (c.pageURL || location.origin + location.pathname).replace(/[?#].*$/, '');
    $('#pairUrl').value = remote ? location.href : `${base}?dash=${s.topic}~${s.key}` + (c.server !== DEFAULTS.server ? `&s=${encodeURIComponent(c.server)}` : '');
    $('#sDirty').textContent = ''; $('#saveS').disabled = true;
  }
  function paintAll(){
    if (!snap){ $('#kpis').innerHTML = `<div class="kpi" style="grid-column:1/-1"><span class="k">${ui('tv')}بنستنى الشاشة</span><span class="s">افتح شاشة الأكواد على جهاز المحل، والبيانات هتظهر هنا لوحدها.</span></div>`; return; }
    $('#dStore').textContent = snap.cfg.store;
    paintKpis(); paintChart(); if (!draft) paintPrizes(); paintWinners(); paintSettings();
    if (remote) $('#openTv').href = (snap.cfg.pageURL || location.origin + location.pathname).replace(/[?#].*$/, '');
  }

  /* -- redeem -- */
  let rCurrent = null;
  async function showResult(code, act){
    const out = $('#rOut'); out.className = 'result'; out.innerHTML = `<span class="pill wait"><span class="spin"></span>بندوّر...</span>`;
    const r = await cmd(act ? 'redeem' : 'lookup', { code });
    if (r.timeout){ out.innerHTML = `<span class="pill bad">الشاشة ما ردتش</span><span class="meta">اتأكد إن شاشة الأكواد مفتوحة ومتصلة بالنت.</span>`; return; }
    if (!r.found){ out.innerHTML = `<span class="pill bad">الكود ده مش موجود</span><span class="meta">راجع الكود مع العميل. الكود بيبدأ بـ GF- وبعده 6 حروف.</span>`; return; }
    const w = r.winner; rCurrent = w.code;
    const justNow = act && !r.already;
    const status = justNow ? `<span class="pill ok">${ui('check')}تم التسليم</span>` : w.redeemedAt ? `<span class="pill bad">اتسلمت قبل كده الساعة ${clock(w.redeemedAt)}</span>` : `<span class="pill wait">لسه ما اتسلمتش</span>`;
    out.innerHTML = `<div class="row"><span class="tl">${pIcon(w)}</span><div><div class="nm">${esc(w.name)}</div><div class="meta">كسبها الساعة ${clock(w.at)} · <span class="mono">${esc(w.code)}</span></div></div></div>
      ${status}${!w.redeemedAt ? `<button class="btn" id="doRedeem" type="button">${ui('check')} تأكيد تسليم الهدية</button>` : ''}`;
    const b = $('#doRedeem'); if (b) b.onclick = () => showResult(rCurrent, true);
    if (justNow) flash('اتسجل التسليم');
  }
  $('#rForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#rCode').value; if (v.trim()) showResult(v, false); });
  $('#wBody').addEventListener('click', e => { const b = e.target.closest('[data-redeem]'); if (!b) return; $('#rCode').value = b.dataset.redeem; showResult(b.dataset.redeem, true); $('#rOut').scrollIntoView({ behavior:'smooth', block:'center' }); });

  /* -- prizes editor -- */
  const ensureDraft = () => { if (!draft) draft = JSON.parse(JSON.stringify(snap.cfg.prizes)); };
  $('#pBody').addEventListener('input', e => {
    const tr = e.target.closest('tr'), k = e.target.dataset.k; if (!tr || !k || !snap) return; ensureDraft();
    const p = draft[+tr.dataset.i]; p[k] = (k === 'total' || k === 'left') ? Math.max(0, parseInt(e.target.value) || 0) : e.target.value;
    if (k === 'icon') tr.querySelector('.tl').innerHTML = pIcon(p);
    $('#pDirty').textContent = 'فيه تغييرات لسه ما اتحفظتش'; $('#saveP').disabled = false;
  });
  $('#pBody').addEventListener('click', e => { const b = e.target.closest('[data-del]'); if (!b) return; ensureDraft(); draft.splice(+b.dataset.del, 1); paintPrizes(); });
  $('#addP').onclick = () => { if (!snap) return; ensureDraft(); draft.push({ id:'', name:'هدية جديدة', icon:'gift', img:'', total:10, left:10 }); paintPrizes(); const ins = $('#pBody').querySelectorAll('input[data-k="name"]'); ins[ins.length - 1].select(); };
  $('#saveP').onclick = async () => {
    if (!draft || !draft.length) return; $('#saveP').disabled = true;
    const r = await cmd('config', { cfg: { prizes: draft } });
    if (r && r.timeout){ flash('الشاشة ما ردتش، جرّب تاني'); $('#saveP').disabled = false; return; }
    draft = null; flash('اتحفظت الهدايا والشاشة اتحدثت'); paintPrizes();
  };

  /* -- settings -- */
  $('#sForm').addEventListener('input', () => { sDirty = true; $('#sDirty').textContent = 'فيه تغييرات لسه ما اتحفظتش'; $('#saveS').disabled = false; });
  $('#sForm').addEventListener('submit', e => e.preventDefault());
  $('#saveS').onclick = async () => {
    const cfg = { store: $('#sStore').value.trim() || DEFAULTS.store, title: $('#sTitle').value.trim(), titleAccent: $('#sAccent').value.trim(), subtitle: $('#sSub').value.trim(),
      liveCodes: $('#sCodes').value, revealSeconds: $('#sSecs').value, pageURL: $('#sUrl').value.trim(), server: $('#sServer').value.trim() || DEFAULTS.server };
    const r = await cmd('config', { cfg });
    if (r && r.timeout){ flash('الشاشة ما ردتش، جرّب تاني'); return; }
    sDirty = false; flash('اتحفظت الإعدادات'); paintSettings(true);
  };
  $('#copyPair').onclick = async () => { const i = $('#pairUrl'); try { await navigator.clipboard.writeText(i.value); flash('اتنسخ الرابط'); } catch { i.select(); flash('الرابط متحدد، انسخه يدوي'); } };
  let armT = 0;
  $('#campaign').onclick = async e => {
    const b = e.currentTarget;
    if (!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'متأكد؟ اضغط تاني للتأكيد'; armT = setTimeout(() => { b.classList.remove('armed'); b.textContent = 'بدء حملة جديدة'; }, 4000); return; }
    clearTimeout(armT); b.classList.remove('armed'); b.textContent = 'بدء حملة جديدة';
    const r = await cmd('campaign', {}); flash(r && r.timeout ? 'الشاشة ما ردتش، جرّب تاني' : 'بدأت حملة جديدة');
  };
  $('#demoBtn').onclick = () => { cmd('demo', {}); flash(lastSeen ? 'اتبعتت تجربة للشاشة' : 'افتح شاشة الأكواد الأول عشان التجربة تظهر عليها'); };
  document.querySelectorAll('.chipf').forEach(c => c.onclick = () => { filter = c.dataset.f; document.querySelectorAll('.chipf').forEach(x => x.setAttribute('aria-pressed', x === c)); paintWinners(); });
  $('#wSearch').addEventListener('input', e => { query = e.target.value; paintWinners(); });

  /* -- live updates -- */
  const onStorage = e => { if (e.key === KEY && !remote){ s = Engine.load() || s; snap = snapshot(s); paintAll(); } };
  addEventListener('storage', onStorage);
  const ro = new ResizeObserver(() => snap && paintChart()); ro.observe($('#chart'));
  const tick = setInterval(() => { paintTv(); if (!remote && snap){ snap = snapshot(s); paintKpis(); paintChart(); } }, 20000);
  const pingT = remote ? setTimeout(() => cmd('lookup', { code:'ping' }), 800) : 0; // asks the screen to answer, so it shows as online
  paintAll(); paintTv();
  dispose.add(() => { adm.close(); removeEventListener('storage', onStorage); ro.disconnect(); clearInterval(tick); clearTimeout(pingT); clearTimeout(flashT); });
}

/* ---------- router ---------- */
const dispose = { fns:[], add(f){ this.fns.push(f); }, run(){ this.fns.splice(0).forEach(f => { try { f(); } catch {} }); } };
function route(){
  dispose.run();
  const app = document.getElementById('app'), params = new URLSearchParams(location.search), h = location.hash;
  if (params.has('g')) return phoneView(app, dispose, params, false);
  if (h === '#phone') return phoneView(app, dispose, params, true);
  if (h === '#dashboard' || (params.has('dash') && h !== '#screen')) return dashView(app, dispose, params);
  if (typeof qrcode === 'undefined'){ app.innerHTML = '<p style="padding:24px">مكتبة الأكواد ما اتحملتش. اتأكد من النت وحدّث الصفحة.</p>'; return; }
  screenView(app, dispose);
}
addEventListener('hashchange', () => { scrollTo(0, 0); route(); });
route();
</script>

</body></html>
