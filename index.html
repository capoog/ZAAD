<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ذِهن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ذِهن: نحو 100 أداة وحاسبة عربية مجانية — العمر والتاريخ الهجري، القروض والزكاة، الصحة والحمل، تحويل الوحدات، واختبارات ممتعة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one-column tool shelf (max 760px) with a sticky top bar and fixed bottom tabs; each tool opens as its own page with inputs above a live result card. */
:root{
  --bg:#E8EEF3; --surface:#FFFFFF; --surface-2:#DCE6EE; --line:#C6D4DF;
  --ink:#0F2436; --ink-dim:#4A6074; --ink-faint:#7D92A4;
  --brand:#12466D; --brand-ink:#FFFFFF; --brand-soft:#D2E3F0;
  --accent:#EFAA12; --accent-ink:#2E2100; --accent-soft:#FBE9BD;
  --ok:#17905F; --ok-soft:#D3F0E2; --warn:#B86E00; --warn-soft:#FBE7C6; --bad:#CC3D3D; --bad-soft:#F8DADA;
  --shadow:0 1px 2px rgba(15,36,54,.08),0 12px 28px -16px rgba(15,36,54,.4);
  --f-display:'Lalezar','Readex Pro',Tahoma,sans-serif;
  --f-body:'Readex Pro',Tahoma,'Segoe UI',Arial,sans-serif;
  --r-l:20px; --r-m:14px; --r-s:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1622; --surface:#112131; --surface-2:#192D40; --line:#244259;
    --ink:#E6EEF5; --ink-dim:#9CB1C3; --ink-faint:#6C8398;
    --brand:#5AAEE3; --brand-ink:#061320; --brand-soft:#163650;
    --accent:#F6C247; --accent-ink:#271C00; --accent-soft:#3A3013;
    --ok:#3DCB8F; --ok-soft:#113A2A; --warn:#F2A93B; --warn-soft:#3A2A10; --bad:#FF6E6E; --bad-soft:#41191C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1622; --surface:#112131; --surface-2:#192D40; --line:#244259;
  --ink:#E6EEF5; --ink-dim:#9CB1C3; --ink-faint:#6C8398;
  --brand:#5AAEE3; --brand-ink:#061320; --brand-soft:#163650;
  --accent:#F6C247; --accent-ink:#271C00; --accent-soft:#3A3013;
  --ok:#3DCB8F; --ok-soft:#113A2A; --warn:#F2A93B; --warn-soft:#3A2A10; --bad:#FF6E6E; --bad-soft:#41191C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;background:var(--bg)}
.logo{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--brand);display:flex;align-items:baseline;gap:4px}
.logo i{width:9px;height:9px;background:var(--accent);border-radius:2px;transform:rotate(45deg);display:inline-block}
.top-actions{display:flex;gap:6px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);flex:none}
.icon-btn:hover{color:var(--brand)}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.faint{color:var(--ink-faint);font-size:13px}
.muted{color:var(--ink-dim)}

/* home */
.hero{padding-block:14px 6px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8vw,46px);line-height:1.15;color:var(--ink)}
.hero h1 span{color:var(--brand)}
.hero p{color:var(--ink-dim);margin-top:8px;max-width:58ch}
.search{position:relative;margin-top:16px}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}
.search input:focus{outline:none;border-color:var(--brand)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 6px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip small{opacity:.7;margin-inline-start:4px}
.sec{margin-top:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.2}
.sec-h span{color:var(--ink-faint);font-size:13px}
.tlist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:620px){.tlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trow{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);transition:border-color .15s ease,transform .15s ease;min-width:0}
.trow:hover{border-color:var(--brand);transform:translateY(-1px)}
.tlink{flex:1;display:flex;gap:12px;align-items:center;padding:12px;min-width:0}
.tic{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tic.fun{background:var(--accent-soft);color:var(--accent-ink)}
:root[data-theme="dark"] .tic.fun{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tic.fun{color:var(--accent)}}
.tt{min-width:0;display:flex;flex-direction:column}
.tt b{font-size:15px;line-height:1.4}
.tt small{color:var(--ink-faint);font-size:12.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tt .ext{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-size:12px;font-weight:600}
.star{border:0;background:none;padding:0 12px;color:var(--ink-faint);display:grid;place-items:center}
.star svg{width:20px;height:20px}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:currentColor}
.empty{text-align:center;color:var(--ink-dim);padding:28px 12px}

/* tool page */
.thead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.crumb{font-size:13px;color:var(--ink-dim);flex:1}
.thead .star{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;padding:0}
.ttl{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,38px);line-height:1.2;margin-top:6px}
.tdesc{color:var(--ink-dim);margin-top:4px;max-width:60ch}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
@media (max-width:420px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:13.5px;font-weight:600;color:var(--ink-dim)}
.fld small{font-size:12px;color:var(--ink-faint)}
input[type=text],input[type=date],input[type=time],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 12px;font-size:16px;min-height:46px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:14px 50%,20px 50%;background-size:6px 6px;background-repeat:no-repeat;padding-left:32px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
.search input[type=search]{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding-block:14px;padding-inline:46px 14px;font-size:16px}
textarea{resize:vertical;min-height:96px;line-height:1.6}
.numwrap{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--surface);overflow:hidden}
.numwrap:focus-within{border-color:var(--brand)}
.numwrap input{border:0;border-radius:0;min-width:0;flex:1;text-align:right}
.numwrap .unit{display:grid;place-items:center;padding-inline:12px;background:var(--surface-2);color:var(--ink-dim);font-size:13px;white-space:nowrap}
.result{margin-top:12px;border-color:var(--brand);border-width:1.5px}
.rbig{display:flex;flex-direction:column;gap:2px;padding-bottom:12px}
.rbig span{font-size:13px;color:var(--ink-dim)}
.rbig b{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.15;color:var(--brand);overflow-wrap:anywhere}
.rbig small{font-size:14px;font-weight:600}
.tone-ok b,.tone-ok small{color:var(--ok)}
.tone-warn b,.tone-warn small{color:var(--warn)}
.tone-bad b,.tone-bad small{color:var(--bad)}
.rrows{margin:0;display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--line)}
.rrows div{display:flex;justify-content:space-between;gap:14px;padding-block:9px;border-bottom:1px dashed var(--line)}
.rrows div:last-child{border-bottom:0}
.rrows dt{color:var(--ink-dim);font-size:14px}
.rrows dd{margin:0;font-weight:600;text-align:left;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.rnote{margin-top:10px;font-size:13px;color:var(--ink-dim);background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px}
.res-err{color:var(--bad);font-weight:600}
.tbl-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:var(--r-s)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:600;color:var(--ink-dim)}
tr:last-child td{border-bottom:0}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bar-row{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s ease}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:600;font-size:14.5px;line-height:1.2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.how{margin-top:16px}
.how summary{cursor:pointer;font-weight:600;color:var(--brand)}
.how p{margin-top:8px;color:var(--ink-dim);font-size:14px}
.related{margin-top:18px}
.rel-chips{display:flex;flex-wrap:wrap;gap:8px}
.rel-chips a{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:13.5px}
.rel-chips a:hover{border-color:var(--brand);color:var(--brand)}

/* custom widgets */
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:9px 10px;font-size:14px;min-width:70px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.swap{align-self:end;height:46px}
.unit-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
@media (max-width:460px){.unit-row{grid-template-columns:minmax(0,1fr)}.swap{justify-self:center}}
.pw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;direction:ltr;text-align:left;overflow-wrap:anywhere;padding:14px;border-radius:var(--r-s);background:var(--surface-2);letter-spacing:.5px}
.check{display:flex;align-items:center;gap:8px;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.dice{font-family:var(--f-display);font-size:64px;line-height:1;text-align:center;color:var(--brand);padding-block:10px;overflow-wrap:anywhere}
.flash{min-height:180px;display:grid;place-items:center;text-align:center;border-radius:var(--r-l);background:var(--brand);color:var(--brand-ink);padding:24px;cursor:pointer;user-select:none}
.flash b{font-size:30px;display:block;direction:ltr}
.flash span{font-size:22px;display:block}
.flash small{opacity:.75;font-size:13px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:start;font-size:15.5px}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.qrbox{display:grid;place-items:center;padding:16px;background:#FFFFFF;border-radius:var(--r-m);border:1px solid var(--line);min-height:120px}
.qrbox img,.qrbox canvas{max-width:100%;height:auto}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.gpa-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr) auto;gap:8px;align-items:center}
.link{background:none;border:0;padding:4px;color:var(--brand);font-weight:600;font-size:14px}
.link.danger{color:var(--bad)}

/* nav, toast, sheet */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav a,.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--ink-faint);border-radius:12px}
.nav [aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.nav span{white-space:nowrap;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(5,15,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:var(--r-l);padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <a class="logo" href="#" aria-label="ذِهن، الصفحة الرئيسية">ذِهن<i></i></a>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" aria-label="تبديل المظهر"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" dir="rtl" aria-label="التنقل الرئيسي"><div class="nav-in" id="navIn"></div></nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheet" hidden></div>
<noscript><p style="padding:20px">يحتاج ذِهن إلى تفعيل JavaScript.</p></noscript>

<script>
(function(){
'use strict';
document.documentElement.lang='ar';
document.documentElement.dir='rtl';

/* ================= HELPERS ================= */
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS='dhihn.tools.v1';
function load(){const d={fav:[],rec:[],inputs:{},theme:'auto',polls:[],eng:{known:[]}};try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&typeof s==='object')return Object.assign(d,s);}catch(e){}return d;}
let S=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function parseNum(s){
  if(typeof s==='number')return s;
  s=String(s==null?'':s).trim().replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/٫/g,'.').replace(/[,٬\s]/g,'');
  if(s==='')return NaN;return Number(s);
}
function fmt(n,dec=2){if(n==null||!isFinite(n))return '—';return Number(n).toLocaleString('en-US',{maximumFractionDigits:dec});}
const f0=n=>fmt(n,0),f1=n=>fmt(n,1),f2=n=>fmt(n,2);
function fmtU(n){if(!isFinite(n))return '—';const a=Math.abs(n);if(a!==0&&(a<1e-4||a>=1e13))return n.toExponential(4);return fmt(n,a<1?6:a<1000?4:2);}
const pctS=n=>fmt(n,2)+'%';
function pl(n,w){n=Math.round(n);const a=Math.abs(n);if(a===1)return w[0];if(a===2)return w[1];if(a>=3&&a<=10)return `${n} ${w[2]}`;return `${fmt(n,0)} ${w[3]}`;}
const W_Y=['سنة واحدة','سنتان','سنوات','سنة'],W_M=['شهر واحد','شهران','أشهر','شهرًا'],W_D=['يوم واحد','يومان','أيام','يومًا'],W_W=['أسبوع واحد','أسبوعان','أسابيع','أسبوعًا'],W_H=['ساعة واحدة','ساعتان','ساعات','ساعة'];
function joinAnd(parts){parts=parts.filter(Boolean);return parts.length?parts.join(' و'):'0';}
const rnd01=()=>{try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}catch(e){return Math.random();}};
const rint=(min,max)=>min+Math.floor(rnd01()*(max-min+1));

/* dates (all in UTC noon to avoid DST/timezone drift) */
const DAY=864e5;
const utc=(y,m,d)=>new Date(Date.UTC(y,m-1,d,12));
const todayU=()=>{const n=new Date();return utc(n.getFullYear(),n.getMonth()+1,n.getDate());};
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?utc(+m[1],+m[2],+m[3]):null;};
const isoD=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>new Date(d.getTime()+n*DAY);
const diffDays=(a,b)=>Math.round((b-a)/DAY);
const GM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];

function ymd(a,b){let y=b.getUTCFullYear()-a.getUTCFullYear(),m=b.getUTCMonth()-a.getUTCMonth(),d=b.getUTCDate()-a.getUTCDate();if(d<0){m--;d+=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),0)).getUTCDate();}if(m<0){y--;m+=12;}return{y,m,d};}
const ymdS=o=>joinAnd([o.y?pl(o.y,W_Y):'',o.m?pl(o.m,W_M):'',o.d?pl(o.d,W_D):''])||'0 يوم';
function addMonths(d,n){const y=d.getUTCFullYear(),m=d.getUTCMonth()+n,day=d.getUTCDate();const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return new Date(Date.UTC(y,m,Math.min(day,last),12));}
let HF=null;try{HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{timeZone:'UTC',year:'numeric',month:'numeric',day:'numeric'});}catch(e){}
function toH(d){if(!HF||!d)return null;const p={};HF.formatToParts(d).forEach(x=>{p[x.type]=x.value;});return{y:parseInt(p.year||p.relatedYear,10),m:+p.month,d:+p.day};}
const fmtH=h=>h?`${h.d} ${HM[h.m-1]} ${h.y} هـ`:'غير متاح في هذا المتصفح';
function fromH(y,m,d){
  if(!HF)return null;
  let g=new Date(Date.UTC(622,6,19,12)+Math.round((y-1)*354.36667+(m-1)*29.5306+(d-1))*DAY);
  for(let i=0;i<25;i++){const h=toH(g);if(h.y===y&&h.m===m&&h.d===d)return g;const step=Math.round((y-h.y)*354.36667+(m-h.m)*29.5306+(d-h.d));g=addDays(g,step||(i%2?1:-1));}
  return null;
}
function nextHijri(m,d,from){const h=toH(from);if(!h)return null;for(const y of [h.y,h.y+1]){const g=fromH(y,m,d)||fromH(y,m,d-1);if(g&&g>=from)return g;}return null;}

/* ================= FINANCE CORE ================= */
function amort(P,ratePct,months){
  const r=ratePct/100/12;
  const pay=r?P*r/(1-Math.pow(1+r,-months)):P/months;
  let bal=P,yP=0,yI=0;const rows=[];
  for(let i=1;i<=months;i++){const int=bal*r,pr=pay-int;bal-=pr;yP+=pr;yI+=int;if(i%12===0||i===months){rows.push([String(Math.ceil(i/12)),f2(yP),f2(yI),f2(Math.max(0,bal))]);yP=0;yI=0;}}
  return{pay,total:pay*months,interest:pay*months-P,rows};
}
function aprFromPay(P,pay,months){
  if(pay*months<=P)return 0;let lo=0,hi=1;
  for(let i=0;i<80;i++){const mid=(lo+hi)/2;const p=P*mid/(1-Math.pow(1+mid,-months));if(p>pay)hi=mid;else lo=mid;}
  return lo*12*100;
}
function loanResult(P,rate,months,type,extraRows=[]){
  if(!(P>0)||!(months>0)||!(rate>=0))return{err:'أدخل مبلغًا ومدة صحيحين ونسبة لا تقل عن صفر.'};
  if(type==='flat'){
    const interest=P*rate/100*months/12,pay=(P+interest)/months;
    return{big:['القسط الشهري',f2(pay)],rows:extraRows.concat([['المبلغ الممول',f2(P)],['إجمالي الأرباح (الفائدة)',f2(interest)],['إجمالي المدفوع',f2(P+interest)],['عدد الأقساط',f0(months)],['معدل الفائدة الفعلي السنوي (APR) تقريبًا',pctS(aprFromPay(P,pay,months))]]),
      note:'في نظام النسبة الثابتة تُحسب الأرباح على أصل المبلغ طوال المدة، لذلك يكون المعدل الفعلي أعلى من النسبة المعلنة تقريبًا بالضعف.'};
  }
  const a=amort(P,rate,months);
  return{big:['القسط الشهري',f2(a.pay)],rows:extraRows.concat([['المبلغ الممول',f2(P)],['إجمالي الفوائد',f2(a.interest)],['إجمالي المدفوع',f2(a.total)],['عدد الأقساط',f0(months)]]),
    table:{h:['السنة','المسدد من الأصل','الفوائد','الرصيد المتبقي'],r:a.rows}};
}

T({id:'add-days',c:'date',n:'إضافة أو طرح مدة من تاريخ',d:'ما التاريخ بعد 90 يومًا أو قبل 6 أشهر من أي يوم؟',kw:'اضافه ايام موعد بعد',
  f:[DT('a','التاريخ','today',{wide:true}),SEL('op','العملية',[['add','بعد (إضافة)'],['sub','قبل (طرح)']]),N('n','المدة',90),SEL('u','الوحدة',[['d','أيام'],['w','أسابيع'],['m','أشهر'],['y','سنوات']])],
  calc(v){if(!v.a||!isFinite(v.n))return{err:'أكمل الحقول.'};const s=v.op==='sub'?-1:1;let r;
    if(v.u==='d')r=addDays(v.a,s*v.n);else if(v.u==='w')r=addDays(v.a,s*v.n*7);else r=addMonths(v.a,s*v.n*(v.u==='y'?12:1));
    return{big:['التاريخ الناتج',fmtD(r)],rows:[['بالهجري',fmtH(toH(r))],['يبعد عن اليوم',pl(Math.abs(diffDays(todayU(),r)),W_D)]]};}});

T({id:'occasions',c:'date',n:'كم باقي على رمضان والعيد',d:'عدّ تنازلي لرمضان وعيد الفطر ويوم عرفة وعيد الأضحى ورأس السنة الهجرية.',kw:'رمضان عيد الفطر الاضحى عرفه راس السنه الهجريه عد تنازلي',
  f:[],
  calc(){if(!HF)return{err:'متصفحك لا يدعم التقويم الهجري.'};const t=todayU();
    const list=[['رمضان',9,1],['عيد الفطر',10,1],['يوم عرفة',12,9],['عيد الأضحى',12,10],['رأس السنة الهجرية',1,1]].map(([n,m,d])=>{const g=nextHijri(m,d,t);return[n,g,g?diffDays(t,g):Infinity];}).sort((a,b)=>a[2]-b[2]);
    const [n0,g0,d0]=list[0];
    return{big:[n0,d0===0?'اليوم! كل عام وأنتم بخير':'بعد '+pl(d0,W_D),fmtD(g0)],rows:list.slice(1).map(([n,g,d])=>[n,g?`بعد ${pl(d,W_D)} · ${fmtDs(g)}`:'—']),note:'المواعيد وفق تقويم أم القرى وقد تختلف يومًا حسب رؤية الهلال في بلدك.'};}});

   ===================================================================== */
T({id:'loan',c:'money',n:'حاسبة القروض',d:'القسط الشهري وإجمالي الفائدة، مع جدول سداد سنوي ونظامي الفائدة الثابتة والمتناقصة.',kw:'قرض شخصي قسط فائده تمويل',
  f:[N('p','مبلغ القرض',100000),N('r','نسبة الفائدة السنوية',5,'%'),N('y','المدة',5,'سنوات'),LOAN_TYPE],
  calc:v=>loanResult(v.p,v.r,Math.round(v.y*12),v.type),
  how:'القسط المتناقص: القسط = المبلغ × ر ÷ (1 − (1+ر)^−ن) حيث ر الفائدة الشهرية ون عدد الأشهر. الثابتة: الأرباح = المبلغ × النسبة × السنوات، ثم تُقسم مع المبلغ على عدد الأشهر.'});

T({id:'mortgage',c:'money',n:'حاسبة التمويل العقاري',d:'قدّر قسط تمويل المنزل بعد الدفعة الأولى وتكلفة التمويل الكاملة.',kw:'عقار منزل بيت رهن سكني',
  f:[N('price','سعر العقار',1000000),N('down','الدفعة الأولى',10,'%'),N('r','نسبة الفائدة السنوية',5,'%'),N('y','المدة',25,'سنة'),LOAN_TYPE],
  calc(v){const dp=v.price*v.down/100;return loanResult(v.price-dp,v.r,Math.round(v.y*12),v.type,[['الدفعة الأولى',f2(dp)]]);}});

T({id:'car',c:'money',n:'حاسبة تمويل السيارات',d:'قسط تمويل السيارة مع الدفعة الأولى والدفعة الأخيرة والرسوم الإدارية.',kw:'سياره تمويل قسط دفعه اخيره بالون',
  f:[N('price','سعر السيارة',120000),N('down','الدفعة الأولى',10,'%'),N('ball','الدفعة الأخيرة',0,'%'),N('r','نسبة المرابحة السنوية',4,'%'),N('y','المدة',5,'سنوات'),N('fee','الرسوم الإدارية',1,'%')],
  calc(v){if(!(v.price>0&&v.y>0))return{err:'أدخل سعرًا ومدة صحيحين.'};const n=Math.round(v.y*12),dp=v.price*v.down/100,fin=v.price-dp,profit=fin*v.r/100*v.y,ball=v.price*v.ball/100,fee=fin*v.fee/100;
    const pay=(fin+profit-ball)/n;if(pay<0)return{err:'الدفعة الأخيرة أكبر من المبلغ الممول.'};
    return{big:['القسط الشهري',f2(pay)],rows:[['الدفعة الأولى',f2(dp)],['المبلغ الممول',f2(fin)],['إجمالي الأرباح',f2(profit)],['الدفعة الأخيرة',f2(ball)],['الرسوم الإدارية',f2(fee)],['التكلفة الإجمالية للسيارة',f2(dp+pay*n+ball+fee)],['معدل الفائدة الفعلي (APR) تقريبًا',pctS(aprFromPay(fin-ball*Math.pow(1+v.r/1200,-n),pay,n))]]};}});

T({id:'installment',c:'money',n:'حاسبة القسط الشهري',d:'قدّر قيمة القسط الشهري لأي مشتريات بالتقسيط.',kw:'تقسيط قسط شهري',
  f:[N('p','السعر',5000),N('down','الدفعة المقدمة',0),N('m','عدد الأشهر',12,'شهرًا'),N('r','نسبة الربح السنوية',0,'%')],
  calc(v){const fin=v.p-v.down;if(!(fin>0&&v.m>0))return{err:'تأكد أن السعر أكبر من الدفعة المقدمة وأن عدد الأشهر صحيح.'};const profit=fin*v.r/100*v.m/12;
    return{big:['القسط الشهري',f2((fin+profit)/v.m)],rows:[['المبلغ المقسّط',f2(fin)],['الأرباح',f2(profit)],['الإجمالي مع المقدم',f2(v.p+profit)]]};}});

T({id:'compound',c:'money',n:'حاسبة الفائدة المركبة',d:'كيف ينمو مالك مع الإيداع الشهري والعائد المركب عبر السنين.',kw:'استثمار عائد مركب نمو ادخار',
  f:[N('p','المبلغ الأولي',10000),N('pm','إيداع شهري',500),N('r','العائد السنوي',7,'%'),N('y','المدة',10,'سنوات'),SEL('f','تكرار التركيب',[['12','شهري'],['4','ربع سنوي'],['1','سنوي'],['365','يومي']])],
  calc(v){if(!(v.y>0))return{err:'أدخل مدة صحيحة.'};const im=Math.pow(1+v.r/100/(+v.f),(+v.f)/12)-1;let bal=v.p||0,dep=v.p||0;const rows=[];
    for(let m=1;m<=Math.round(v.y*12);m++){bal=bal*(1+im)+(v.pm||0);dep+=v.pm||0;if(m%12===0)rows.push([String(m/12),f2(dep),f2(bal-dep),f2(bal)]);}
    return{big:['الرصيد النهائي',f2(bal)],rows:[['إجمالي ما أودعته',f2(dep)],['الأرباح',f2(bal-dep)],['نسبة النمو',pctS(dep?(bal-dep)/dep*100:0)]],table:{h:['السنة','الإيداعات','الأرباح','الرصيد'],r:rows}};}});

T({id:'savings',c:'money',n:'حاسبة الادخار',d:'كم تدّخر شهريًا لتصل إلى هدفك في الموعد؟',kw:'ادخار هدف توفير',
  f:[N('goal','المبلغ المستهدف',50000),N('cur','المدّخر حاليًا',5000),N('m','خلال',24,'شهرًا'),N('r','العائد السنوي المتوقع',0,'%')],
  calc(v){if(!(v.m>0))return{err:'أدخل مدة صحيحة.'};const i=v.r/100/12,fvCur=v.cur*Math.pow(1+i,v.m),need=v.goal-fvCur;
    if(need<=0)return{big:['الادخار الشهري المطلوب','0'],rows:[['ملاحظة','مدّخراتك الحالية تكفي لبلوغ الهدف']]};
    const pm=i?need*i/(Math.pow(1+i,v.m)-1):need/v.m;
    return{big:['ادّخر شهريًا',f2(pm)],rows:[['يوميًا تقريبًا',f2(pm/30.44)],['إجمالي ما ستودعه',f2(pm*v.m)],['أرباح العائد',f2(v.goal-v.cur-pm*v.m)]]};}});

T({id:'roi',c:'money',n:'حاسبة العائد على الاستثمار',d:'احسب نسبة العائد الإجمالي والعائد السنوي المركب (CAGR).',kw:'roi عائد استثمار ربح cagr',
  f:[N('inv','المبلغ المستثمر',10000),N('fin','القيمة الحالية أو عند البيع',14500),N('y','مدة الاستثمار',3,'سنوات')],
  calc(v){if(!(v.inv>0))return{err:'أدخل مبلغًا مستثمرًا أكبر من صفر.'};const roi=(v.fin-v.inv)/v.inv*100,c=v.y>0&&v.fin>0?(Math.pow(v.fin/v.inv,1/v.y)-1)*100:NaN;
    return{big:['العائد على الاستثمار',pctS(roi)],tone:roi>=0?'ok':'bad',rows:[['الربح أو الخسارة',f2(v.fin-v.inv)],['العائد السنوي المركب',isFinite(c)?pctS(c):'—']]};}});

T({id:'credit-card',c:'money',n:'حاسبة سداد بطاقة الائتمان',d:'كم شهرًا تحتاج لسداد رصيد البطاقة وكم ستدفع فوائد.',kw:'بطاقه ائتمان كريدت سداد رصيد',
  f:[N('b','رصيد البطاقة',10000),N('apr','الفائدة السنوية',30,'%'),N('pay','الدفعة الشهرية',600)],
  calc(v){const i=v.apr/100/12;if(!(v.b>0&&v.pay>0))return{err:'أدخل الرصيد والدفعة.'};if(v.pay<=v.b*i)return{err:'الدفعة الشهرية لا تغطي الفائدة، فلن ينتهي الدين أبدًا. زِد الدفعة.',};
    let b=v.b,m=0,int=0;while(b>0&&m<1200){const x=b*i;int+=x;b=b+x-v.pay;m++;}
    return{big:['مدة السداد',ymdS({y:Math.floor(m/12),m:m%12,d:0})],rows:[['عدد الدفعات',f0(m)],['إجمالي الفوائد',f2(int)],['إجمالي المدفوع',f2(v.b+int)]],note:'كل زيادة صغيرة في الدفعة الشهرية تختصر المدة والفوائد كثيرًا.'};}});

T({id:'dti',c:'money',n:'نسبة الدين إلى الدخل',d:'اعرف نسبة التزاماتك الشهرية إلى دخلك وهل هي آمنة.',kw:'التزامات دين دخل نسبه استقطاع',
  f:[N('inc','الدخل الشهري',15000),N('h','إيجار أو قسط سكن',3000),N('car','قسط سيارة',1500),N('cc','بطاقات وقروض أخرى',800)],
  calc(v){if(!(v.inc>0))return{err:'أدخل الدخل الشهري.'};const d=(v.h||0)+(v.car||0)+(v.cc||0),r=d/v.inc*100;
    return{big:['نسبة الدين إلى الدخل',pctS(r),r<=33?'ممتازة':r<=43?'مقبولة لكن احذر':'مرتفعة'],tone:tone(r,33,43),rows:[['إجمالي الالتزامات',f2(d)],['المتبقي من الدخل',f2(v.inc-d)]],
      bars:[['السكن',v.h/v.inc*100],['السيارة',v.car/v.inc*100],['أخرى',v.cc/v.inc*100]].map(([l,p])=>[l,p,pctS(p)]),note:'تضع كثير من البنوك حدًا أعلى للاستقطاع بين 33% و45% من الراتب حسب البلد ونوع التمويل.'};}});

T({id:'discount',c:'money',n:'حاسبة الخصم',d:'السعر بعد الخصم، وما توفّره، حتى مع خصم إضافي فوق الخصم.',kw:'تخفيض اوكازيون سعر خصم',
  f:[N('p','السعر الأصلي',400),N('d1','نسبة الخصم',25,'%'),N('d2','خصم إضافي (اختياري)',0,'%')],
  calc(v){const a=v.p*(1-v.d1/100),b=a*(1-(v.d2||0)/100);return{big:['السعر بعد الخصم',f2(b)],rows:[['وفّرت',f2(v.p-b)],['نسبة الخصم الفعلية',pctS(v.p?(v.p-b)/v.p*100:0)]]};}});

T({id:'vat',c:'money',n:'حاسبة ضريبة القيمة المضافة',d:'أضف الضريبة إلى السعر أو استخرجها من سعر شامل.',kw:'ضريبه vat قيمه مضافه 15',
  f:[N('a','المبلغ',1000),SEL('rate','النسبة',[['15','15% (السعودية)'],['5','5% (الإمارات، البحرين، عُمان)'],['14','14% (مصر)'],['16','16% (الأردن)'],['10','10% (البحرين 2022+)'],['c','نسبة أخرى']]),N('cr','النسبة المخصصة',12,'%',{when:v=>v.rate==='c'}),SEL('mode','العملية',[['add','إضافة الضريبة'],['ext','استخراج الضريبة من سعر شامل']])],
  calc(v){const r=(v.rate==='c'?v.cr:+v.rate)/100;if(v.mode==='add'){const t=v.a*r;return{big:['السعر شامل الضريبة',f2(v.a+t)],rows:[['قيمة الضريبة',f2(t)],['السعر قبل الضريبة',f2(v.a)]]};}
    const base=v.a/(1+r);return{big:['السعر قبل الضريبة',f2(base)],rows:[['قيمة الضريبة',f2(v.a-base)],['السعر الشامل',f2(v.a)]]};}});

T({id:'zakat',c:'money',n:'حاسبة الزكاة',d:'زكاة المال والذهب والأسهم وعروض التجارة مع حساب النصاب بسعر الذهب.',kw:'زكاه نصاب ذهب مال',
  f:[N('cash','النقد والأرصدة البنكية',50000),N('gold','قيمة الذهب والفضة المدّخرة',0),N('inv','أسهم واستثمارات (القيمة السوقية)',0),N('trade','عروض التجارة (البضائع)',0),N('recv','ديون لك يُرجى سدادها',0),N('debt','ديون عليك حالّة',0),N('gp','سعر غرام الذهب عيار 24',400,'',{wide:true,hint:'يُستخدم لحساب النصاب = 85 غرامًا من الذهب'})],
  calc(v){const tot=['cash','gold','inv','trade','recv'].reduce((s,k)=>s+(v[k]||0),0)-(v.debt||0),nis=85*(v.gp||0);
    if(!(nis>0))return{err:'أدخل سعر غرام الذهب لحساب النصاب.'};
    if(tot<nis)return{big:['الزكاة الواجبة','0'],rows:[['صافي المال الزكوي',f2(tot)],['النصاب',f2(nis)]],note:'مالك أقل من النصاب فلا زكاة عليه الآن.'};
    return{big:['الزكاة الواجبة (2.5%)',f2(tot*0.025)],tone:'ok',rows:[['صافي المال الزكوي',f2(tot)],['النصاب',f2(nis)]],note:'تجب الزكاة إذا بلغ المال النصاب وحال عليه الحول (سنة هجرية). للحالات الخاصة كالأسهم والرواتب المتراكمة يُستحسن سؤال أهل العلم.'};}});

T({id:'split',c:'money',n:'تقسيم الفاتورة والبقشيش',d:'قسّم حساب المطعم بين الأصدقاء مع البقشيش.',kw:'فاتوره مطعم بقشيش تقسيم',
  f:[N('b','قيمة الفاتورة',450),N('tip','البقشيش',10,'%'),N('n','عدد الأشخاص',4)],
  calc(v){if(!(v.n>=1))return{err:'أدخل عدد الأشخاص.'};const t=v.b*v.tip/100;return{big:['على كل شخص',f2((v.b+t)/v.n)],rows:[['البقشيش',f2(t)],['الإجمالي',f2(v.b+t)]]};}});

T({id:'net-salary',c:'work',n:'حاسبة الراتب الصافي',d:'احسب صافي راتبك بعد التأمينات والاستقطاعات.',kw:'راتب صافي تامينات اجتماعيه gosi استقطاع',
  f:[N('basic','الراتب الأساسي',10000),N('house','بدل السكن',2500),N('trans','بدل النقل',1000),N('other','بدلات أخرى',0),N('gosi','نسبة التأمينات على (الأساسي + السكن)',9.75,'%',{hint:'9.75% للسعوديين في القطاع الخاص؛ عدّلها حسب بلدك'}),N('ded','استقطاعات أخرى ثابتة',0)],
  calc(v){const gross=(v.basic||0)+(v.house||0)+(v.trans||0)+(v.other||0),g=((v.basic||0)+(v.house||0))*(v.gosi||0)/100,net=gross-g-(v.ded||0);
    return{big:['الراتب الصافي',f2(net)],rows:[['إجمالي الراتب',f2(gross)],['التأمينات',f2(g)],['استقطاعات أخرى',f2(v.ded||0)],['الصافي السنوي',f2(net*12)]]};}});

T({id:'eos',c:'work',n:'حاسبة مكافأة نهاية الخدمة',d:'تقدير المكافأة وفق نظام العمل السعودي حسب مدة الخدمة وسبب انتهاء العقد.',kw:'نهايه خدمه مكافاه استقاله نظام العمل',
  f:[N('w','آخر أجر شهري',12000),SEL('why','سبب انتهاء العلاقة',[['end','انتهاء العقد أو إنهاء من صاحب العمل'],['res','استقالة']]),DT('s','تاريخ بداية العمل','2016-01-01'),DT('e','تاريخ نهاية العمل','today')],
  calc(v){if(!v.s||!v.e||v.e<=v.s)return{err:'تأكد من التواريخ.'};const a=ymd(v.s,v.e),yrs=a.y+a.m/12+a.d/365;
    const full=Math.min(yrs,5)*v.w/2+Math.max(0,yrs-5)*v.w;let f=1;if(v.why==='res')f=yrs<2?0:yrs<5?1/3:yrs<10?2/3:1;
    return{big:['المكافأة التقديرية',f2(full*f)],rows:[['مدة الخدمة',ymdS(a)],['المكافأة الكاملة',f2(full)],['النسبة المستحقة',v.why==='res'?(f===0?'لا شيء (أقل من سنتين)':f===1?'كاملة':f<.5?'الثلث':'الثلثان'):'كاملة']],
      note:'نصف أجر شهر عن كل سنة من السنوات الخمس الأولى، وأجر شهر كامل عن كل سنة بعدها (المادة 84). وفي الاستقالة: لا شيء قبل سنتين، والثلث من 2 إلى 5 سنوات، والثلثان من 5 إلى 10، وكاملة بعد 10 (المادة 85). الأجر يشمل الأساسي والبدلات الثابتة.'};}});

T({id:'hourly',c:'work',n:'حاسبة الأجر بالساعة',d:'حوّل راتبك الشهري إلى أجر تقريبي بالساعة واليوم.',kw:'اجر ساعه يومي راتب',
  f:[N('s','الراتب الشهري',8000),N('h','ساعات العمل يوميًا',8,'ساعات'),N('d','أيام العمل أسبوعيًا',5,'أيام')],
  calc(v){const hrs=v.h*v.d*52/12;if(!(hrs>0))return{err:'أدخل ساعات وأيام العمل.'};return{big:['الأجر بالساعة',f2(v.s/hrs)],rows:[['الأجر اليومي',f2(v.s*12/52/v.d)],['ساعات العمل شهريًا',f1(hrs)],['الراتب السنوي',f2(v.s*12)]]};}});

T({id:'work-hours',c:'work',n:'حاسبة ساعات العمل',d:'احسب ساعات العمل اليومية والأسبوعية والإضافية من وقت الحضور والانصراف.',kw:'دوام حضور انصراف ساعات اضافي',
  f:[TM('a','وقت الحضور','08:00'),TM('b','وقت الانصراف','17:00'),N('br','الاستراحة',60,'دقيقة'),N('d','أيام العمل أسبوعيًا',5,'أيام'),N('std','ساعات الدوام الرسمي يوميًا',8,'ساعات',{wide:true})],
  calc(v){const tm=s=>{const m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?+m[1]*60+ +m[2]:NaN;};let a=tm(v.a),b=tm(v.b);if(!isFinite(a)||!isFinite(b))return{err:'أدخل الوقتين.'};if(b<=a)b+=1440;
    const mins=Math.max(0,b-a-(v.br||0)),h=mins/60,ot=Math.max(0,h-(v.std||0));
    return{big:['ساعات العمل يوميًا',`${Math.floor(mins/60)} س ${mins%60} د`],rows:[['أسبوعيًا',f1(h*v.d)+' ساعة'],['شهريًا تقريبًا',f1(h*v.d*52/12)+' ساعة'],['ساعات إضافية يوميًا',f2(ot)],['ساعات إضافية أسبوعيًا',f2(ot*v.d)]]};}});

T({id:'work-days',c:'work',n:'حاسبة أيام العمل بين تاريخين',d:'عدد أيام العمل بين تاريخين مع استبعاد العطلة الأسبوعية والإجازات.',kw:'ايام عمل دوام عطله اجازه',
  f:[DT('a','من تاريخ','today'),DT('b','إلى تاريخ','2026-12-31'),SEL('we','العطلة الأسبوعية',[['5,6','الجمعة والسبت'],['6,0','السبت والأحد'],['5','الجمعة فقط'],['','لا يوجد']]),N('hol','إجازات رسمية في الفترة',0,'يوم')],
  calc(v){if(!v.a||!v.b||v.b<v.a)return{err:'تأكد من التواريخ.'};const we=v.we===''?[]:v.we.split(',').map(Number);let w=0,o=0;
    for(let d=v.a;d<=v.b;d=addDays(d,1)){if(we.includes(d.getUTCDay()))o++;else w++;}
    return{big:['أيام العمل',f0(Math.max(0,w-(v.hol||0)))],rows:[['إجمالي الأيام (شاملة البداية والنهاية)',f0(w+o)],['أيام العطلة الأسبوعية',f0(o)],['الإجازات المستبعدة',f0(v.hol||0)]]};}});

   ===================================================================== */
const bmiCat=b=>b<18.5?['نقص في الوزن','warn']:b<25?['وزن طبيعي','ok']:b<30?['زيادة في الوزن','warn']:['سمنة','bad'];
T({id:'bmi',c:'health',n:'حساب الوزن ومؤشر كتلة الجسم',d:'احسب BMI والوزن المثالي والوزن الصحي المناسب لطولك.',kw:'bmi وزن مثالي كتله الجسم سمنه رجيم',
  f:[N('w','الوزن',75,'كغ'),N('h','الطول',170,'سم'),SEX],
  calc(v){const m=v.h/100;if(!(v.w>0&&m>0))return{err:'أدخل الوزن والطول.'};const b=v.w/(m*m),[cat,tn]=bmiCat(b);const inch=v.h/2.54,dev=(v.sex==='m'?50:45.5)+2.3*Math.max(0,inch-60);
    const lo=18.5*m*m,hi=24.9*m*m;const diff=v.w<lo?`تحتاج زيادة ${f1(lo-v.w)} كغ`:v.w>hi?`تحتاج إنقاص ${f1(v.w-hi)} كغ`:'وزنك ضمن النطاق الصحي';
    return{big:['مؤشر كتلة الجسم',f1(b),cat],tone:tn,rows:[['الوزن الصحي لطولك',`${f1(lo)} – ${f1(hi)} كغ`],['الوزن المثالي (معادلة ديفاين)',f1(dev)+' كغ'],['للوصول للنطاق الصحي',diff]],
      bars:[['نقص < 18.5',b<18.5?100:0,''],['طبيعي 18.5–25',b>=18.5&&b<25?100:0,''],['زيادة 25–30',b>=25&&b<30?100:0,''],['سمنة ≥ 30',b>=30?100:0,'']],note:'مؤشر الكتلة لا يفرّق بين العضل والدهون، ولا يناسب الحوامل والأطفال.'};}});

T({id:'bodyfat',c:'health',n:'حاسبة نسبة الدهون في الجسم',d:'تقدير تقريبي لنسبة الدهون باستخدام BMI والعمر والجنس.',kw:'دهون الجسم نسبه',
  f:[N('w','الوزن',75,'كغ'),N('h','الطول',170,'سم'),N('age','العمر',30,'سنة'),SEX],
  calc(v){const m=v.h/100,b=v.w/(m*m),bf=1.2*b+0.23*v.age-10.8*(v.sex==='m'?1:0)-5.4;const r=v.sex==='m'?[[6,'رياضي'],[18,'لياقة جيدة'],[25,'متوسط'],[99,'مرتفع']]:[[14,'رياضي'],[25,'لياقة جيدة'],[32,'متوسط'],[99,'مرتفع']];
    const lbl=r.find(x=>bf<=x[0])[1];return{big:['نسبة الدهون التقديرية',pctS(bf),lbl],tone:lbl==='مرتفع'?'bad':'ok',rows:[['كتلة الدهون',f1(v.w*bf/100)+' كغ'],['الكتلة الخالية من الدهون',f1(v.w*(1-bf/100))+' كغ']],note:'معادلة دورنبرغ تقديرية؛ القياس بالأجهزة أو بالمقص (Skinfold) أدق.'};}});

const ACT=[['1.2','قليل الحركة (عمل مكتبي)'],['1.375','نشاط خفيف (1–3 أيام رياضة)'],['1.55','نشاط متوسط (3–5 أيام)'],['1.725','نشاط عالٍ (6–7 أيام)'],['1.9','رياضي محترف أو عمل بدني شاق']];
const bmr=v=>10*v.w+6.25*v.h-5*v.age+(v.sex==='m'?5:-161);
T({id:'bmr',c:'health',n:'حاسبة معدل الأيض الأساسي BMR',d:'عدد السعرات التي يحرقها جسمك في الراحة بمعادلة Mifflin-St Jeor.',kw:'bmr حرق سعرات ايض',
  f:[N('w','الوزن',75,'كغ'),N('h','الطول',170,'سم'),N('age','العمر',30,'سنة'),SEX],
  calc:v=>({big:['معدل الأيض الأساسي',f0(bmr(v))+' سعرة/يوم'],rows:[['في الساعة',f0(bmr(v)/24)+' سعرة']]}),how:'للرجال: 10×الوزن + 6.25×الطول − 5×العمر + 5. للنساء: نفسها − 161.'});

T({id:'tdee',c:'health',n:'حاسبة السعرات اليومية TDEE',d:'احتياجك اليومي من السعرات حسب نشاطك، ولإنقاص الوزن أو زيادته.',kw:'سعرات حراريه tdee رجيم دايت',
  f:[N('w','الوزن',75,'كغ'),N('h','الطول',170,'سم'),N('age','العمر',30,'سنة'),SEX,SEL('act','مستوى النشاط',ACT,'1.375',{wide:true})],
  calc(v){const t=bmr(v)*+v.act;return{big:['للحفاظ على وزنك',f0(t)+' سعرة/يوم'],rows:[['لإنقاص 0.5 كغ أسبوعيًا',f0(t-500)],['لإنقاص 1 كغ أسبوعيًا',f0(Math.max(t-1000,v.sex==='m'?1500:1200))],['لزيادة الوزن ببطء',f0(t+300)],['معدل الأيض الأساسي',f0(bmr(v))]],
    bars:[['بروتين 30%',30,f0(t*.3/4)+' غ'],['كربوهيدرات 40%',40,f0(t*.4/4)+' غ'],['دهون 30%',30,f0(t*.3/9)+' غ']]};}});

T({id:'protein',c:'health',n:'حاسبة البروتين اليومي',d:'كم غرامًا من البروتين تحتاج يوميًا حسب وزنك وهدفك.',kw:'بروتين عضلات تضخيم',
  f:[N('w','الوزن',75,'كغ'),SEL('g','هدفك',[['0.8,1','صحة عامة'],['1.2,1.6','نشاط رياضي منتظم'],['1.6,2.2','بناء العضلات'],['1.2,1.6','إنقاص الوزن مع الحفاظ على العضل'],['1.1,1.3','كبار السن']])],
  calc(v){const [a,b]=v.g.split(',').map(Number);return{big:['احتياجك اليومي',`${f0(v.w*a)} – ${f0(v.w*b)} غ`],rows:[['في 3 وجبات',`${f0(v.w*a/3)} – ${f0(v.w*b/3)} غ لكل وجبة`],['يعادل تقريبًا',`${f1(v.w*(a+b)/2/31)} صدر دجاج (100 غ)`]]};}});

T({id:'water',c:'health',n:'حاسبة احتياج الماء اليومي',d:'تقدير مبسط لكمية الماء التي يحتاجها جسمك يوميًا.',kw:'ماء شرب ترطيب لتر',
  f:[N('w','الوزن',75,'كغ'),N('ex','رياضة يوميًا',30,'دقيقة'),SEL('hot','الطقس',[['0','معتدل'],['0.5','حار'],['0.75','حار جدًا']])],
  calc(v){const l=v.w*0.033+(v.ex||0)/30*0.35+ +v.hot;return{big:['احتياجك اليومي',f1(l)+' لتر'],rows:[['أكواب (250 مل)',f0(l*4)],['قارورات (500 مل)',f1(l*2)]],note:'يشمل الماء من الطعام والمشروبات. يحتاج المرضى (الكلى والقلب) لاستشارة الطبيب.'};}});

T({id:'bio-age',c:'health',n:'حاسبة العمر البيولوجي',d:'تقدير مبسط لعمر جسمك الحقيقي بناءً على نمط حياتك.',kw:'عمر بيولوجي نمط الحياه صحه',
  f:[N('age','عمرك الفعلي',35,'سنة'),N('w','الوزن',75,'كغ'),N('h','الطول',170,'سم'),
    SEL('smoke','التدخين',[['0','لا أدخن'],['2','أقلعت عنه'],['6','أدخن']]),SEL('ex','الرياضة أسبوعيًا',[['3','لا أمارس'],['1','مرة أو مرتين'],['-1','3 إلى 4 مرات'],['-3','5 مرات أو أكثر']],'1'),
    SEL('sleep','النوم ليلًا',[['2','أقل من 6 ساعات'],['-1','من 7 إلى 8 ساعات'],['1','أكثر من 9 ساعات']],'-1'),SEL('diet','غذاؤك',[['2','وجبات سريعة كثيرًا'],['0','متوسط'],['-2','صحي وخضار يوميًا']],'0'),
    SEL('stress','التوتر',[['2','مرتفع أغلب الوقت'],['0','متوسط'],['-1','منخفض']],'0'),SEL('social','العلاقات الاجتماعية',[['1','قليلة'],['0','متوسطة'],['-1','قوية']],'0')],
  calc(v){if(!(v.age>0))return{err:'أدخل عمرك.'};const b=v.w/((v.h/100)**2);const bAdj=b<18.5?1:b<25?-1:b<30?1:3;
    const adj=['smoke','ex','sleep','diet','stress','social'].reduce((s,k)=>s+ +v[k],0)+bAdj,bio=Math.max(18,v.age+adj);
    return{big:['عمرك البيولوجي التقديري',pl(Math.round(bio),W_Y),adj<0?`أصغر من عمرك بـ ${Math.abs(adj)}`:adj>0?`أكبر من عمرك بـ ${adj}`:'مطابق لعمرك'],tone:adj<=0?'ok':adj<=4?'warn':'bad',
      rows:[['مؤشر كتلة الجسم',f1(b)]],note:'تقدير للتوعية والمتعة مبني على عوامل نمط الحياة المعروفة، وليس فحصًا طبيًا.'};}});

T({id:'sleep',c:'health',n:'حاسبة النوم',d:'أفضل أوقات النوم أو الاستيقاظ حسب دورات النوم (90 دقيقة).',kw:'نوم استيقاظ دورات منبه',
  f:[SEL('mode','أريد أن',[['wake','أستيقظ في وقت محدد'],['now','أنام الآن']],null,{wide:true}),TM('t','وقت الاستيقاظ','06:30',{when:v=>v.mode==='wake'})],
  calc(v){const h=m=>{m=((m%1440)+1440)%1440;const H=Math.floor(m/60),M=m%60,ap=H<12?'ص':'م';return `${(H%12)||12}:${String(M).padStart(2,'0')} ${ap}`;};
    if(v.mode==='now'){const n=new Date(),m=n.getHours()*60+n.getMinutes()+15;return{big:['استيقظ في',h(m+90*6)+' أو '+h(m+90*5)],rows:[4,3].map(c=>[`${c} دورات (${c*1.5} ساعات)`,h(m+90*c)]),note:'حسبنا 15 دقيقة حتى تغفو.'};}
    const mm=/^(\d{1,2}):(\d{2})/.exec(v.t||'');if(!mm)return{err:'أدخل وقت الاستيقاظ.'};const w=+mm[1]*60+ +mm[2];
    return{big:['نم في',h(w-90*6-15)+' أو '+h(w-90*5-15)],rows:[6,5,4].map(c=>[`${c} دورات (${c*1.5} ساعات نوم)`,h(w-90*c-15)]),note:'الاستيقاظ في نهاية دورة نوم يجعلك أنشط. حسبنا 15 دقيقة حتى تغفو.'};}});

T({id:'pregnancy',c:'women',n:'حاسبة الحمل والولادة',d:'موعد الولادة المتوقع وعمر الحمل بالأسابيع ومراحله.',kw:'حمل ولاده موعد اسبوع ثلث',
  f:[SEL('m','الحساب من',[['lmp','أول يوم في آخر دورة'],['conc','تاريخ الإخصاب'],['due','موعد الولادة المعروف']]),DT('d','التاريخ',-60)],
  calc(v){if(!v.d)return{err:'اختر التاريخ.'};const lmp=v.m==='lmp'?v.d:v.m==='conc'?addDays(v.d,-14):addDays(v.d,-280);const due=addDays(lmp,280),t=todayU(),ga=diffDays(lmp,t);
    if(ga<0)return{err:'التاريخ في المستقبل.'};const w=Math.floor(ga/7),d=ga%7,tri=w<13?'الثلث الأول':w<27?'الثلث الثاني':'الثلث الثالث';
    const ms=[['نهاية الثلث الأول',13],['فحص السونار المفصّل',20],['بداية الثلث الثالث',27],['اكتمال الحمل',37],['موعد الولادة',40]];
    return{big:['موعد الولادة المتوقع',fmtD(due),ga>294?'تجاوزتِ الموعد المتوقع':`${pl(w,W_W)} و${pl(d,W_D)} · ${tri}`],rows:[['المتبقي',ga<=280?pl(280-ga,W_D):'—'],['الموعد بالهجري',fmtH(toH(due))],['الإخصاب التقريبي',fmtDs(addDays(lmp,14))]],
      bars:[['التقدم',Math.min(100,ga/280*100),pctS(Math.min(100,ga/280*100))]],table:{h:['المرحلة','الأسبوع','التاريخ'],r:ms.map(([n,wk])=>[n,String(wk),fmtDs(addDays(lmp,wk*7))])},note:'معادلة نايجل التقديرية؛ 4% فقط يولدون في الموعد بالضبط. تابعي مع طبيبتك.'};}});

T({id:'ovulation',c:'women',n:'حاسبة التبويض وأيام الخصوبة',d:'تقدير موعد الإباضة وفترة الخصوبة للدورات الثلاث القادمة.',kw:'تبويض اباضه خصوبه حمل',
  f:[DT('l','أول يوم في آخر دورة',-10),N('c','طول الدورة',28,'يومًا',{hint:'المعتاد بين 21 و35 يومًا'})],
  calc(v){if(!v.l||!(v.c>=20&&v.c<=45))return{err:'تأكدي من التاريخ وطول الدورة (20–45).'};const rows=[];
    for(let i=0;i<3;i++){const s=addDays(v.l,i*v.c),ov=addDays(s,v.c-14);rows.push([fmtDs(s),`${fmtDs(addDays(ov,-5))} – ${fmtDs(addDays(ov,1))}`,fmtDs(ov)]);}
    const ov0=addDays(v.l,v.c-14);return{big:['يوم التبويض المتوقع',fmtD(ov0)],rows:[['أيام الخصوبة',`${fmtDs(addDays(ov0,-5))} – ${fmtDs(addDays(ov0,1))}`],['الدورة القادمة',fmtDs(addDays(v.l,+v.c))]],
      table:{h:['بداية الدورة','أيام الخصوبة','التبويض'],r:rows},note:'تقدير مبني على أن التبويض يحدث قبل الدورة التالية بـ 14 يومًا تقريبًا. لا يُعتمد عليه وسيلةً لمنع الحمل.'};}});

T({id:'period',c:'women',n:'حاسبة الدورة الشهرية',d:'مواعيد الدورة الشهرية القادمة لستة أشهر.',kw:'دوره شهريه حيض موعد',
  f:[DT('l','أول يوم في آخر دورة',-10),N('c','طول الدورة',28,'يومًا'),N('n','مدة الدورة',5,'أيام')],
  calc(v){if(!v.l||!(v.c>=20&&v.c<=45))return{err:'تأكدي من التاريخ وطول الدورة.'};const t=todayU();let s=v.l;while(s<=t)s=addDays(s,v.c);const rows=[];
    for(let i=0;i<6;i++){const a=addDays(s,i*v.c);rows.push([fmtDs(a),fmtDs(addDays(a,(v.n||5)-1)),fmtH(toH(a))]);}
    return{big:['الدورة القادمة',fmtD(s),'بعد '+pl(diffDays(t,s),W_D)],table:{h:['البداية','النهاية','بالهجري'],r:rows}};}});

   DAILY LIFE
   ===================================================================== */
T({id:'fuel',c:'daily',n:'حاسبة استهلاك الوقود',d:'احسب استهلاك سيارتك لكل 100 كم وعدد الكيلومترات لكل لتر.',kw:'بنزين وقود استهلاك سياره',
  f:[N('km','المسافة المقطوعة',450,'كم'),N('l','الوقود المستهلك',35,'لتر')],
  calc(v){if(!(v.km>0&&v.l>0))return{err:'أدخل المسافة والوقود.'};return{big:['الاستهلاك',f2(v.l/v.km*100)+' لتر / 100 كم'],rows:[['كم لكل لتر',f2(v.km/v.l)],['ميل لكل غالون أمريكي',f1(v.km/v.l*2.352145)]]};}});

T({id:'trip',c:'daily',n:'حاسبة تكلفة الوقود للرحلة',d:'كم ستكلّفك الرحلة بالسيارة، ونصيب كل راكب.',kw:'رحله سفر بنزين تكلفه',
  f:[N('km','المسافة',500,'كم'),N('c','استهلاك السيارة',8,'لتر/100كم'),N('p','سعر اللتر',2.33),SEL('rt','الرحلة',[['1','ذهاب فقط'],['2','ذهاب وعودة']],'2'),N('n','عدد الركاب',1)],
  calc(v){const L=v.km*(+v.rt)*v.c/100,c=L*v.p;return{big:['تكلفة الوقود',f2(c)],rows:[['كمية الوقود',f1(L)+' لتر'],['على كل راكب',f2(c/Math.max(1,v.n||1))]]};}});

T({id:'speed',c:'daily',n:'حاسبة المسافة والسرعة والزمن',d:'احسب أيًّا منها إذا عرفت الآخرَين.',kw:'سرعه مسافه زمن وقت الوصول',
  f:[SEL('find','أريد حساب',[['t','الزمن'],['d','المسافة'],['s','السرعة']],null,{wide:true}),N('d','المسافة',300,'كم',{when:v=>v.find!=='d'}),N('s','السرعة',100,'كم/س',{when:v=>v.find!=='s'}),N('t','الزمن',2.5,'ساعة',{when:v=>v.find!=='t'})],
  calc(v){const hm=h=>`${Math.floor(h)} ساعة و${Math.round((h%1)*60)} دقيقة`;
    if(v.find==='t'){if(!(v.s>0))return{err:'أدخل السرعة.'};const t=v.d/v.s;return{big:['الزمن',hm(t)],rows:[['بالدقائق',f0(t*60)]]};}
    if(v.find==='d')return{big:['المسافة',f2(v.s*v.t)+' كم'],rows:[['بالميل',f2(v.s*v.t/1.609344)]]};

/* tafqeet */
const ONES=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
const TEENS=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const HUND=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function w999(n){const h=Math.floor(n/100),r=n%100,parts=[];if(h)parts.push(HUND[h]);if(r){if(r<10)parts.push(ONES[r]);else if(r<20)parts.push(TEENS[r-10]);else{const o=r%10,t=Math.floor(r/10);parts.push(o?`${ONES[o]} و${TENS[t]}`:TENS[t]);}}return parts.join(' و');}
const SCALES=[[1e9,['مليار','ملياران','مليارات','مليارًا']],[1e6,['مليون','مليونان','ملايين','مليونًا']],[1e3,['ألف','ألفان','آلاف','ألفًا']]];
function scaleWord(n,f){if(n===1)return f[0];if(n===2)return f[1];const r=n%100;if(n>=3&&n<=10)return `${w999(n)} ${f[2]}`;if(r>=11&&r<=99)return `${w999(n)} ${f[3]}`;return `${w999(n)} ${f[0]}`;}
function tafqeet(n){if(n===0)return 'صفر';const parts=[];for(const [v,f] of SCALES){const q=Math.floor(n/v);if(q){parts.push(scaleWord(q,f));n%=v;}}if(n)parts.push(w999(n));return parts.join(' و');}
const CUR={none:null,sar:['ريال سعودي','ريالان سعوديان','ريالات سعودية','ريالًا سعوديًا','هللة',100],egp:['جنيه مصري','جنيهان مصريان','جنيهات مصرية','جنيهًا مصريًا','قرش',100],aed:['درهم إماراتي','درهمان إماراتيان','دراهم إماراتية','درهمًا إماراتيًا','فلس',100],kwd:['دينار كويتي','ديناران كويتيان','دنانير كويتية','دينارًا كويتيًا','فلس',1000],usd:['دولار أمريكي','دولاران أمريكيان','دولارات أمريكية','دولارًا أمريكيًا','سنت',100]};
T({id:'tafqeet',c:'daily',n:'تفقيط الأرقام (الرقم كتابةً)',d:'حوّل أي مبلغ إلى كلمات عربية لكتابة الشيكات والعقود والفواتير.',kw:'تفقيط كتابه الارقام بالحروف شيك',
  f:[TX('n','المبلغ أو الرقم','12500.75',{wide:true}),SEL('cur','العملة',[['sar','ريال سعودي'],['egp','جنيه مصري'],['aed','درهم إماراتي'],['kwd','دينار كويتي'],['usd','دولار أمريكي'],['none','بدون عملة']])],
  calc(v){const s=String(v.n).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[,٬\s]/g,'').replace('٫','.');if(!/^\d{1,12}(\.\d+)?$/.test(s))return{err:'أدخل رقمًا موجبًا حتى 12 خانة.'};
    const [ip,fp='']=s.split('.'),n=+ip,c=CUR[v.cur];
    if(!c){let out=tafqeet(n);if(fp)out+=` فاصلة ${tafqeet(+fp)}`;return{big:['كتابةً',out]};}
    const sub=Math.round(+('0.'+(fp||'0'))*c[5]);const r=n%100;
    const main=n===0?'':n===1?`${c[0]} واحد`:n===2?c[1]:r>=3&&r<=10?`${tafqeet(n)} ${c[2]}`:r>=11?`${tafqeet(n)} ${c[3]}`:`${tafqeet(n)} ${c[0]}`;
    let out='فقط '+(main||'')+(sub?`${main?' و':''}${sub} ${c[4]}`:'')+' لا غير';
    return{big:['كتابةً',out],rows:[['الرقم',fmt(+s,3)]]};}});

T({id:'average',c:'math',n:'حاسبة المتوسط والإحصاء',d:'المتوسط والوسيط والمنوال والانحراف المعياري لمجموعة أرقام.',kw:'متوسط حسابي وسيط منوال انحراف معياري معدل درجات',

    const s=a.reduce((x,y)=>x+y,0),m=s/a.length,so=[...a].sort((x,y)=>x-y),md=so.length%2?so[(so.length-1)/2]:(so[so.length/2-1]+so[so.length/2])/2;
    const cnt={};a.forEach(x=>cnt[x]=(cnt[x]||0)+1);const mx=Math.max(...Object.values(cnt)),mode=mx>1?Object.keys(cnt).filter(k=>cnt[k]===mx).join('، '):'لا يوجد';

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;};
T({id:'fractions',c:'math',n:'حاسبة الكسور',d:'اجمع واطرح واضرب واقسم الكسور مع التبسيط والعدد الكسري.',kw:'كسور بسط مقام تبسيط',
  f:[N('a','بسط الكسر الأول',3),N('b','مقام الكسر الأول',4),SEL('op','العملية',[['+','جمع +'],['-','طرح −'],['*','ضرب ×'],['/','قسمة ÷']],null,{wide:true}),N('c','بسط الكسر الثاني',2),N('d','مقام الكسر الثاني',3)],
  calc(v){if(![v.a,v.b,v.c,v.d].every(Number.isInteger))return{err:'استخدم أعدادًا صحيحة.'};if(!v.b||!v.d)return{err:'المقام لا يمكن أن يكون صفرًا.'};let n,d;
    if(v.op==='+'){n=v.a*v.d+v.c*v.b;d=v.b*v.d;}else if(v.op==='-'){n=v.a*v.d-v.c*v.b;d=v.b*v.d;}else if(v.op==='*'){n=v.a*v.c;d=v.b*v.d;}else{if(!v.c)return{err:'لا يمكن القسمة على صفر.'};n=v.a*v.d;d=v.b*v.c;}
    if(d<0){n=-n;d=-d;}const g=gcd(n,d);n/=g;d/=g;const whole=Math.trunc(n/d),rem=Math.abs(n%d);
    return{big:['الناتج',d===1?String(n):`${n}/${d}`],rows:[['عدد كسري',whole&&rem?`${whole} و ${rem}/${d}`:d===1?String(n):`${n}/${d}`],['عدد عشري',fmt(n/d,6)]]};}});

T({id:'zodiac-love',c:'fun',n:'الأبراج والزواج',d:'نسبة التوافق بين برجين في الزواج والعلاقة (للتسلية).',kw:'توافق الابراج زواج حب',

T({id:'personality-test',c:'fun',n:'اختبار وتحليل الشخصية',d:'12 سؤالًا تكشف نمط شخصيتك على أربعة محاور مع وصف مبسط.',kw:'تحليل الشخصيه نمط mbti انطوائي اجتماعي',custom:personalityTool});
function personalityTool(el){
  let i=0,sc=[0,0,0,0];
  const draw=()=>{
    if(i>=PQ.length){const code=AXES.map((a,k)=>sc[k]>=2?a[0]:a[1]).join('');
      el.innerHTML=`<section class="card result">${resHTML({big:['نمط شخصيتك',`${code} · ${MBTI[code]}`],bars:AXES.map((a,k)=>{const p=sc[k]/3*100;return[p>=50?a[2]:a[3],p>=50?p:100-p,`${Math.round(p>=50?p:100-p)}%`];}),
        rows:AXES.map((a,k)=>[`${a[2]} أم ${a[3]}؟`,sc[k]>=2?a[2]:a[3]]),note:'مستوحى من نماذج الأنماط الشخصية الشائعة بشكل مبسط وللتسلية؛ الشخصية أوسع من أربعة حروف.'})}</section>
        <div class="btn-row"><button class="btn accent" id="ptCopy">${ic('copy')}انسخ النتيجة</button><button class="btn" id="ptAgain">${ic('refresh')}أعد الاختبار</button></div>`;
      $('#ptAgain').onclick=()=>{i=0;sc=[0,0,0,0];draw();};$('#ptCopy').onclick=()=>copyText(`ذِهن · تحليل الشخصية\nنمطي: ${code} (${MBTI[code]})${shareURL('personality-test')?'\n'+shareURL('personality-test'):''}`);return;}
    const q=PQ[i],flip=rnd01()<.5,opts=flip?[[q[3],0],[q[2],1]]:[[q[2],1],[q[3],0]];
    el.innerHTML=`<div class="card stack"><div class="prog"><i style="width:${i/PQ.length*100}%"></i></div><span class="faint num">${i+1} / ${PQ.length}</span><h2 style="font-size:20px">${q[1]}</h2>
      <div class="opts">${opts.map(o=>`<button class="opt" data-s="${o[1]}">${o[0]}</button>`).join('')}</div></div>`;
    $$('[data-s]',el).forEach(b=>b.onclick=()=>{sc[q[0]]+= +b.dataset.s;i++;draw();});};
  draw();
}

T({id:'birthday-messages',c:'fun',n:'رسائل عيد الميلاد',d:'رسائل تهنئة جاهزة للأصدقاء والأهل والأطفال والزملاء، باسم من تحب.',kw:'رسائل تهنئه عيد ميلاد عبارات',custom:bdayTool});
function bdayTool(el){
  let cat=0;const name=()=>(($('#bdName')||{}).value||'').trim();
  const draw=()=>{const nm=name()||(S.inputs.bday!=null?S.inputs.bday:'نورة');el.innerHTML=`<div class="card stack"><div class="fld"><label for="bdName">اسم صاحب المناسبة</label><input type="text" id="bdName" maxlength="40" value="${esc(nm)}" placeholder="مثال: نورة"></div>
      <div class="chips" role="group" style="padding-block:0">${BDAY.map((c,i)=>`<button class="chip" data-c="${i}" aria-pressed="${i===cat}">${c[0]}</button>`).join('')}</div></div>
      <div class="stack" style="margin-top:12px" id="bdList"></div>`;
    $('#bdList').innerHTML=list();
    $$('[data-c]',el).forEach(b=>b.onclick=()=>{cat=+b.dataset.c;draw();});
    $('#bdName').oninput=()=>{S.inputs.bday=name();save();$('#bdList').innerHTML=list();bind();};bind();};
  const fill=s=>{const n=name();return n?s.replace(/\{name\}/g,n):s.replace(/ يا \{name\}|\{name\}،? ?/g,'').replace(/\s+([!،.])/g,'$1');};
  const list=()=>BDAY[cat][1].map((m,i)=>`<div class="card" style="display:flex;gap:12px;align-items:flex-start;justify-content:space-between"><p style="flex:1;min-width:0">${esc(fill(m))}</p><button class="icon-btn" data-cp="${i}" aria-label="انسخ الرسالة">${ic('copy')}</button></div>`).join('');
  const bind=()=>$$('[data-cp]',el).forEach(b=>b.onclick=()=>copyText(fill(BDAY[cat][1][+b.dataset.cp])));
  draw();
}

function clockTool(el){
  el.innerHTML=`<div class="card stack"><div class="rbig"><span>الوقت عندك</span><b class="num" id="ckMe"></b><small id="ckMeD"></small></div><div class="search" style="margin:0">${ic('search')}<input type="search" id="cq" placeholder="ابحث عن مدينة" aria-label="ابحث عن مدينة"></div></div><div class="tbl-wrap" id="ck"></div>`;
  const off=tz=>{const d=new Date();const p={};new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(d).forEach(x=>p[x.type]=x.value);return (Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute)-Math.floor(d.getTime()/6e4)*6e4)/36e5;};
  const tf=tz=>{try{return new Intl.DateTimeFormat('ar-EG-u-nu-latn',{timeZone:tz,hour:'numeric',minute:'2-digit',weekday:'short'}).format(new Date());}catch(e){return '—';}};
  const draw=()=>{if(!document.body.contains(el)){clearInterval(liveT);return;}
    const now=new Date();$('#ckMe').textContent=now.toLocaleTimeString('ar-EG-u-nu-latn',{hour:'numeric',minute:'2-digit',second:'2-digit'});$('#ckMeD').textContent=fmtH(toH(todayU()))+' · '+fmtDs(todayU());
    const me=-now.getTimezoneOffset()/60,q=norm(($('#cq')||{value:''}).value.trim());
    const rows=CITIES.filter(c=>!q||norm(c[0]).includes(q)).map(([n,tz])=>{let o;try{o=off(tz);}catch(e){return null;}const d=o-me;return `<tr><td>${n}</td><td class="num">${tf(tz)}</td><td class="num" dir="ltr" style="text-align:right">${d===0?'نفس توقيتك':(d>0?'+':'')+fmt(d,2)+' س'}</td></tr>`;}).filter(Boolean);
    $('#ck').innerHTML=`<table><thead><tr><th>المدينة</th><th>الوقت</th><th>الفرق عنك</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="3">لا توجد نتيجة</td></tr>'}</tbody></table>`;};
  $('#cq').addEventListener('input',draw);draw();clearInterval(liveT);liveT=setInterval(draw,1000);
}

    <section class="card result" id="cr" aria-live="polite"></section><div class="btn-row"><button class="btn" id="copyRes">${ic('copy')}انسخ النتيجة</button></div>`;
  const run=()=>{const x=parseNum($('#cv').value),a=$('#ca').value,b=$('#cb').value,man=parseNum($('#cm').value);S.inputs.currency={v:$('#cv').value,a,b};save();

    const res=!isFinite(x)?{err:'أدخل المبلغ.'}:!isFinite(r)?{err:'لا يتوفر سعر لهذه العملة حاليًا (تحتاج اتصالًا بالإنترنت). أدخل السعر يدويًا.'}:
      {big:[`${fmt(x,2)} ${nm(a)} =`,`${fmt(x*r,r<1?4:2)} ${nm(b)}`],rows:[[`1 ${a}`,`${fmt(r,6)} ${b}`],[`1 ${b}`,`${fmt(1/r,6)} ${a}`],['مصدر السعر',isFinite(man)&&man>0?'سعر يدوي':src+(when?' · '+when:'')]],note:'أسعار استرشادية؛ أسعار البنوك ومحلات الصرافة تختلف قليلًا.'};
    $('#cr').innerHTML=resHTML(res);LAST={t:TOOLS.find(t=>t.id==='currency'),r:res};};

function passwordTool(el){
  const sv=Object.assign({len:16,up:true,lo:true,di:true,sy:true,sim:false},S.inputs.password||{});
  el.innerHTML=`<div class="card stack">
    <div class="pw num" id="pwOut" aria-live="polite"></div>
    <div class="fld"><label for="pwLen">الطول: <b id="pwLenV">${sv.len}</b> حرفًا</label><input type="range" id="pwLen" min="6" max="64" value="${sv.len}" style="accent-color:var(--brand)"></div>
    <div class="fgrid">
      ${[['up','حروف كبيرة A-Z'],['lo','حروف صغيرة a-z'],['di','أرقام 0-9'],['sy','رموز !@#$'],['sim','استبعد المتشابهة (O0Il1)']].map(([k,l])=>`<label class="check"><input type="checkbox" id="pw_${k}" ${sv[k]?'checked':''}>${l}</label>`).join('')}
    </div>
    <div><div class="bar"><i id="pwBar"></i></div><small class="faint" id="pwStr"></small></div>
    <div class="btn-row"><button class="btn primary" id="pwGen">${ic('refresh')}كلمة جديدة</button><button class="btn accent" id="pwCopy">${ic('copy')}انسخ</button></div>
    <p class="faint">تُولَّد كلمة المرور على جهازك باستخدام مولّد الأرقام العشوائية الآمن في المتصفح، ولا تُرسل إلى أي مكان.</p></div>`;
  let cur='';
  const gen=()=>{const o={len:+$('#pwLen').value};['up','lo','di','sy','sim'].forEach(k=>o[k]=$('#pw_'+k).checked);S.inputs.password=o;save();$('#pwLenV').textContent=o.len;
    const sets=[];if(o.up)sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');if(o.lo)sets.push('abcdefghijklmnopqrstuvwxyz');if(o.di)sets.push('0123456789');if(o.sy)sets.push('!@#$%^&*()-_=+[]{};:,.?/');
    if(!sets.length){$('#pwOut').textContent='اختر نوعًا واحدًا على الأقل';cur='';return;}
    const clean=s=>o.sim?s.replace(/[O0Il1|]/g,''):s;const all=sets.map(clean).join('');
    const chars=sets.map(s=>{const c=clean(s);return c[Math.floor(rnd01()*c.length)];});while(chars.length<o.len)chars.push(all[Math.floor(rnd01()*all.length)]);
    for(let i=chars.length-1;i>0;i--){const j=Math.floor(rnd01()*(i+1));[chars[i],chars[j]]=[chars[j],chars[i]];}
    cur=chars.slice(0,o.len).join('');$('#pwOut').textContent=cur;
    const bits=o.len*Math.log2(all.length),p=Math.min(100,bits/1.28),lbl=bits<40?'ضعيفة':bits<60?'متوسطة':bits<90?'قوية':'قوية جدًا';
    $('#pwBar').style.width=p+'%';$('#pwBar').style.background=bits<40?'var(--bad)':bits<60?'var(--warn)':'var(--ok)';$('#pwStr').textContent=`${lbl} · ${Math.round(bits)} بت من العشوائية`;};
  el.addEventListener('input',gen);$('#pwGen').onclick=gen;$('#pwCopy').onclick=()=>{if(cur)copyText(cur);};gen();
}

      else if(mode==='coin'){out.textContent=rnd01()<.5?'ملك':'كتابة';sub.textContent='';}

      out.classList.remove('fade');void out.offsetWidth;out.classList.add('fade');};
  };draw();
}

let qrLoading=null;

function qrTool(el){
  const sv=(S.inputs.qr&&S.inputs.qr.t)||'https://example.com';
  el.innerHTML=`<div class="card stack"><div class="fld"><label for="qrT">الرابط أو النص</label><textarea id="qrT" rows="3" dir="auto">${esc(sv)}</textarea></div>

  let tm=null;const draw=()=>{const t=$('#qrT').value.trim();S.inputs.qr={t};save();const box=$('#qrBox');if(!t){box.innerHTML='<span class="faint">اكتب نصًا</span>';return;}
    loadQR().then(()=>{box.innerHTML='';try{new window.QRCode(box,{text:t,width:240,height:240,colorDark:'#0F2436',colorLight:'#FFFFFF',correctLevel:window.QRCode.CorrectLevel.M});}catch(e){box.innerHTML='<span class="res-err">النص طويل جدًا لرمز واحد.</span>';}})
      .catch(()=>{box.innerHTML='<span class="res-err">تعذّر تحميل مكتبة QR. تحقق من الاتصال بالإنترنت.</span>';});};
  $('#qrT').addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(draw,300);});draw();
}

function gpaTool(el){
  const st=Object.assign({scale:5,rows:[['الرياضيات','A',3],['الفيزياء','B+',4],['اللغة العربية','A+',2],['البرمجة','B',3]],prevG:'',prevH:''},S.inputs.gpa||{});
  const draw=()=>{const G=st.scale==5?GRADES5:GRADES4;
    el.innerHTML=`<div class="card stack"><div class="seg" role="group" aria-label="النظام">${[[5,'من 5'],[4,'من 4']].map(([k,l])=>`<button data-sc="${k}" aria-pressed="${st.scale==k}">${l}</button>`).join('')}</div>
      ${st.rows.map((r,i)=>`<div class="gpa-row"><input type="text" data-i="${i}" data-k="0" value="${esc(r[0])}" placeholder="المادة" aria-label="اسم المادة"><select data-i="${i}" data-k="1" aria-label="التقدير">${G.map(g=>`<option ${g[0]===r[1]?'selected':''}>${g[0]}</option>`).join('')}</select><input type="text" inputmode="numeric" dir="ltr" data-i="${i}" data-k="2" value="${esc(r[2])}" aria-label="الساعات"><button class="link danger" data-del="${i}" aria-label="حذف">${ic('trash')}</button></div>`).join('')}
      <button class="btn" id="gAdd">${ic('plus')}أضف مادة</button>
      <div class="fgrid"><div class="fld"><label for="gpG">المعدل التراكمي السابق (اختياري)</label><input type="text" inputmode="decimal" dir="ltr" id="gpG" value="${esc(st.prevG)}"></div><div class="fld"><label for="gpH">الساعات السابقة</label><input type="text" inputmode="numeric" dir="ltr" id="gpH" value="${esc(st.prevH)}"></div></div></div>
      <section class="card result" id="gRes" aria-live="polite"></section>`;
    $$('[data-sc]',el).forEach(b=>b.onclick=()=>{st.scale=+b.dataset.sc;persist();draw();});
    $$('[data-del]',el).forEach(b=>b.onclick=()=>{st.rows.splice(+b.dataset.del,1);persist();draw();});
    $('#gAdd').onclick=()=>{st.rows.push(['',G[0][0],3]);persist();draw();};
    calc();};
  const persist=()=>{S.inputs.gpa=st;save();};
  const calc=()=>{const G=st.scale==5?GRADES5:GRADES4;let pts=0,hrs=0;st.rows.forEach(r=>{const g=G.find(x=>x[0]===r[1]),h=parseNum(r[2]);if(g&&h>0){pts+=g[1]*h;hrs+=h;}});
    const sem=hrs?pts/hrs:NaN,pg=parseNum(st.prevG),ph=parseNum(st.prevH),cum=isFinite(pg)&&ph>0?(pg*ph+pts)/(ph+hrs):NaN;
    const lbl=x=>{const r=x/st.scale;return r>=.9?'ممتاز':r>=.75?'جيد جدًا':r>=.6?'جيد':r>=.4?'مقبول':'ضعيف';};
    $('#gRes').innerHTML=resHTML(hrs?{big:['المعدل الفصلي',fmt(sem,2)+' من '+st.scale,lbl(sem)],rows:[['الساعات',f0(hrs)],['النقاط',fmt(pts,2)]].concat(isFinite(cum)?[['المعدل التراكمي الجديد',fmt(cum,2)+' ('+lbl(cum)+')']]:[])}:{err:'أضف مادة واحدة على الأقل بساعات صحيحة.'});};
  el.addEventListener('input',e=>{const x=e.target;if(x.dataset.i!=null){st.rows[+x.dataset.i][+x.dataset.k]=x.value;}else if(x.id==='gpG')st.prevG=x.value;else if(x.id==='gpH')st.prevH=x.value;persist();calc();});
  el.addEventListener('change',e=>{const x=e.target;if(x.dataset.i!=null){st.rows[+x.dataset.i][+x.dataset.k]=x.value;persist();calc();}});
  draw();
}

function mentalTool(el){
  let i=0,score=0,order=[0,1,2,3];const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;};
  const draw=()=>{
    if(i>=MENTAL.length){const age=Math.round(9+score*1.35),lbl=age<18?'روح طفل مرِح':age<28?'شاب متحمّس':age<42?'ناضج ومتوازن':'حكيم هادئ';
      el.innerHTML=`<section class="card result">${resHTML({big:['عمرك العقلي',pl(age,W_Y),lbl],note:'اختبار للتسلية مبني على اختياراتك، وليس قياسًا نفسيًا علميًا.'})}</section><div class="btn-row"><button class="btn accent" id="mCopy">${ic('copy')}انسخ النتيجة</button><button class="btn" id="mAgain">${ic('refresh')}أعد الاختبار</button></div>`;
      $('#mAgain').onclick=()=>{i=0;score=0;draw();};$('#mCopy').onclick=()=>copyText(`ذِهن · اختبار العمر العقلي\nعمري العقلي: ${pl(age,W_Y)} (${lbl})${shareURL('mental-age')?'\n'+shareURL('mental-age'):''}`);return;}
    order=sh([0,1,2,3]);const q=MENTAL[i];
    el.innerHTML=`<div class="card stack"><div class="prog"><i style="width:${i/MENTAL.length*100}%"></i></div><span class="faint num">${i+1} / ${MENTAL.length}</span><h2 style="font-size:20px">${q[0]}</h2>
      <div class="opts">${order.map(k=>`<button class="opt" data-s="${k}">${q[1][k]}</button>`).join('')}</div></div>`;
    $$('[data-s]',el).forEach(b=>b.onclick=()=>{score+= +b.dataset.s;i++;draw();});};
  draw();
}
