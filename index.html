function englishTool(el){
  let cat=0,idx=0,flip=false,mode='cards',qz=null;const canSpeak='speechSynthesis' in window;
  const all=ENG.flatMap(c=>c[1]);
  const draw=()=>{
    const head=`<div class="seg" role="group">${[['cards','بطاقات'],['quiz','اختبرني']].map(([k,l])=>`<button data-md="${k}" aria-pressed="${mode===k}">${l}</button>`).join('')}</div>`;
    if(mode==='cards'){const w=ENG[cat][1][idx],known=S.eng.known.includes(w[0]);
      el.innerHTML=`<div class="card stack">${head}<div class="fld"><label for="eCat">المجموعة</label><select id="eCat">${ENG.map((c,i)=>`<option value="${i}" ${i===cat?'selected':''}>${c[0]} (${c[1].length})</option>`).join('')}</select></div>
        <div class="flash" id="eCard" role="button" tabindex="0" aria-label="اقلب البطاقة">${flip?`<span>${w[1]}</span><small>${esc(w[0])}</small>`:`<b>${esc(w[0])}</b><small>اضغط لرؤية المعنى</small>`}</div>
        <div class="btn-row" style="justify-content:space-between"><button class="btn" id="ePrev">السابق</button>${canSpeak?`<button class="btn" id="eSay">${ic('speaker')}انطق</button>`:''}<button class="btn ${known?'accent':''}" id="eKnow">${known?'حفظتها ✓':'حفظتها'}</button><button class="btn primary" id="eNext">التالي</button></div>
        <p class="faint num">${idx+1} / ${ENG[cat][1].length} · حفظت ${S.eng.known.length} من ${all.length} كلمة</p></div>`;
      $('#eCat').onchange=e=>{cat=+e.target.value;idx=0;flip=false;draw();};
      const fl=()=>{flip=!flip;draw();};$('#eCard').onclick=fl;$('#eCard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fl();}};
      $('#ePrev').onclick=()=>{idx=(idx-1+ENG[cat][1].length)%ENG[cat][1].length;flip=false;draw();};
      $('#eNext').onclick=()=>{idx=(idx+1)%ENG[cat][1].length;flip=false;draw();};
      if(canSpeak)$('#eSay').onclick=()=>speak(w[0]);
      $('#eKnow').onclick=()=>{const k=S.eng.known,j=k.indexOf(w[0]);if(j>=0)k.splice(j,1);else k.push(w[0]);save();draw();};
    }else{
      if(!qz){const pool=[...all].sort(()=>rnd01()-.5).slice(0,10);qz={i:0,score:0,pool,ans:null};}
      if(qz.i>=qz.pool.length){el.innerHTML=`<div class="card stack">${head}${resHTML({big:['نتيجتك',`${qz.score} / ${qz.pool.length}`,qz.score>=8?'ممتاز!':qz.score>=5?'جيد، استمر':'راجع البطاقات وحاول مرة أخرى'],tone:qz.score>=8?'ok':'warn'})}<button class="btn primary" id="qAgain">${ic('refresh')}اختبار جديد</button></div>`;
        $('#qAgain').onclick=()=>{qz=null;draw();};bindMode();return;}
      const w=qz.pool[qz.i];if(!qz.opts){const wrong=all.filter(x=>x[0]!==w[0]).sort(()=>rnd01()-.5).slice(0,3);qz.opts=[w,...wrong].sort(()=>rnd01()-.5);}
      el.innerHTML=`<div class="card stack">${head}<div class="prog"><i style="width:${qz.i/qz.pool.length*100}%"></i></div><span class="faint num">${qz.i+1} / ${qz.pool.length} · النتيجة ${qz.score}</span>
        <div style="display:flex;align-items:center;gap:10px;justify-content:space-between"><h2 style="font-size:26px;direction:ltr">${esc(w[0])}</h2>${canSpeak?`<button class="icon-btn" id="qSay" aria-label="انطق">${ic('speaker')}</button>`:''}</div>
        <div class="opts">${qz.opts.map((o,k)=>`<button class="opt ${qz.ans!=null?(o===w?'right':k===qz.ans?'wrong':''):''}" data-k="${k}" ${qz.ans!=null?'disabled':''}>${o[1]}</button>`).join('')}</div>
        ${qz.ans!=null?`<button class="btn primary" id="qNext">التالي</button>`:''}</div>`;
      if(canSpeak)$('#qSay').onclick=()=>speak(w[0]);
      $$('[data-k]',el).forEach(b=>b.onclick=()=>{qz.ans=+b.dataset.k;if(qz.opts[qz.ans]===w)qz.score++;draw();});
      if(qz.ans!=null)$('#qNext').onclick=()=>{qz.i++;qz.ans=null;qz.opts=null;draw();};
    }
    bindMode();};
  const bindMode=()=>$$('[data-md]',el).forEach(b=>b.onclick=()=>{mode=b.dataset.md;qz=null;draw();});
  draw();
}

function pollTool(el){
  let view=S.polls.length?'list':'new',cur=null,arm=null;
  const draw=()=>{
    if(view==='new'){
      el.innerHTML=`<div class="card stack"><div class="fld"><label for="pQ">السؤال</label><input type="text" id="pQ" maxlength="140" placeholder="أين نقضي العطلة؟"></div>
        <div class="fld"><label for="pO">الخيارات (خيار في كل سطر، من 2 إلى 8)</label><textarea id="pO" rows="5" placeholder="البحر\nالجبل\nالبيت"></textarea></div>
        <div id="pErr" class="res-err" role="alert"></div><button class="btn primary block" id="pMake">أنشئ الاستطلاع</button>
        ${S.polls.length?`<button class="btn ghost" id="pList">استطلاعاتي (${S.polls.length})</button>`:''}
        <p class="faint">مناسب للتصويت في الفصل أو الاجتماع أو العائلة على جهاز واحد: كل شخص يضغط اختياره ثم يمرّر الجهاز. النتائج محفوظة على هذا الجهاز.</p></div>`;
      $('#pMake').onclick=()=>{const q=$('#pQ').value.trim(),o=$('#pO').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,8);if(!q){$('#pErr').textContent='اكتب السؤال.';return;}if(o.length<2){$('#pErr').textContent='أضف خيارين على الأقل.';return;}
        const p={id:Date.now().toString(36),q,o:o.map(t=>({t,v:0})),hide:false};S.polls.unshift(p);save();cur=p;view='vote';draw();};
      if($('#pList'))$('#pList').onclick=()=>{view='list';draw();};return;}
    if(view==='list'){
      el.innerHTML=`<div class="stack"><button class="btn primary" id="pNew">${ic('plus')}استطلاع جديد</button>${S.polls.map(p=>{const t=p.o.reduce((a,b)=>a+b.v,0);return `<div class="card" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div style="min-width:0"><b>${esc(p.q)}</b><div class="faint num">${t} صوتًا · ${p.o.length} خيارات</div></div><div class="btn-row" style="margin:0"><button class="btn" data-open="${p.id}">فتح</button><button class="link danger" data-del="${p.id}">${arm===p.id?'تأكيد الحذف':ic('trash')}</button></div></div>`;}).join('')}</div>`;
      $('#pNew').onclick=()=>{view='new';draw();};
      $$('[data-open]',el).forEach(b=>b.onclick=()=>{cur=S.polls.find(p=>p.id===b.dataset.open);view='vote';draw();});
      $$('[data-del]',el).forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(arm===id){S.polls=S.polls.filter(p=>p.id!==id);arm=null;save();if(!S.polls.length)view='new';}else arm=id;draw();});return;}
    const p=cur,t=p.o.reduce((a,b)=>a+b.v,0),mx=Math.max(...p.o.map(x=>x.v));
    el.innerHTML=`<div class="card stack"><h2 style="font-size:22px">${esc(p.q)}</h2><div class="opts">${p.o.map((x,i)=>`<button class="opt" data-v="${i}">${esc(x.t)}</button>`).join('')}</div>
      <label class="check"><input type="checkbox" id="pHide" ${p.hide?'checked':''}>إخفاء النتائج حتى انتهاء التصويت</label></div>
      <section class="card result" aria-live="polite">${p.hide?`<div class="rbig"><span>عدد الأصوات</span><b class="num">${t}</b></div>`:resHTML({big:['إجمالي الأصوات',f0(t),t&&mx?'الأعلى: '+p.o.filter(x=>x.v===mx).map(x=>x.t).join('، '):''],bars:p.o.map(x=>[x.t,t?x.v/t*100:0,`${x.v} (${f0(t?x.v/t*100:0)}%)`])})}</section>
      <div class="btn-row"><button class="btn" id="pCopy">${ic('copy')}انسخ النتائج</button><button class="btn ghost" id="pReset">تصفير الأصوات</button><button class="btn ghost" id="pBack">كل الاستطلاعات</button></div>`;
    $$('[data-v]',el).forEach(b=>b.onclick=()=>{p.o[+b.dataset.v].v++;save();toast('تم تسجيل صوتك، مرّر الجهاز');draw();});
    $('#pHide').onchange=e=>{p.hide=e.target.checked;save();draw();};
    $('#pReset').onclick=()=>{if(arm!=='reset'){arm='reset';$('#pReset').textContent='اضغط مجددًا للتأكيد';return;}p.o.forEach(x=>x.v=0);arm=null;save();draw();};
    $('#pBack').onclick=()=>{view='list';draw();};
    $('#pCopy').onclick=()=>copyText(`استطلاع: ${p.q}\n`+p.o.map(x=>`${x.t}: ${x.v} (${f0(t?x.v/t*100:0)}%)`).join('\n')+`\nالإجمالي: ${t}`);};
  draw();
}

/* ================= GENERIC FORM ENGINE ================= */
let LAST=null,liveT=null;
function defVal(f){if(f.t==='date'){if(f.d==='today')return isoD(todayU());if(typeof f.d==='number')return isoD(addDays(todayU(),f.d));return f.d||'';}return f.d==null?'':String(f.d);}
function fieldHTML(f,val){
  const id='f_'+f.k;let inp;
  if(f.t==='sel')inp=`<select id="${id}" name="${f.k}">${f.o.map(([v,l])=>`<option value="${esc(v)}" ${String(val)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  else if(f.t==='date')inp=`<input type="date" id="${id}" name="${f.k}" value="${esc(val)}">`;
  else if(f.t==='time')inp=`<input type="time" id="${id}" name="${f.k}" value="${esc(val)}">`;
  else if(f.t==='area')inp=`<textarea id="${id}" name="${f.k}" rows="5" dir="auto">${esc(val)}</textarea>`;
  else if(f.t==='text')inp=`<input type="text" id="${id}" name="${f.k}" value="${esc(val)}" maxlength="80" dir="auto">`;
  else inp=`<div class="numwrap"><input type="text" inputmode="decimal" dir="ltr" id="${id}" name="${f.k}" value="${esc(val)}" autocomplete="off">${f.u?`<span class="unit">${f.u}</span>`:''}</div>`;
  return `<div class="fld${f.wide||f.t==='area'?' wide':''}" id="w_${f.k}"><label for="${id}">${f.l}</label>${inp}${f.hint?`<small>${f.hint}</small>`:''}</div>`;
}
function parseVals(t,raw){const v={};t.f.forEach(f=>{const x=raw[f.k];v[f.k]=f.t==='num'?parseNum(x):f.t==='date'?parseD(x):x;});return v;}
function resHTML(r){
  if(!r)return '';if(r.err)return `<div class="res-err">${esc(r.err)}</div>`;let h='';
  if(r.big)h+=`<div class="rbig ${r.tone?'tone-'+r.tone:''}"><span>${esc(r.big[0])}</span><b class="num">${esc(r.big[1])}</b>${r.big[2]?`<small>${esc(r.big[2])}</small>`:''}</div>`;
  if(r.rows&&r.rows.length)h+=`<dl class="rrows">${r.rows.map(([l,v])=>`<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
  if(r.bars)h+=`<div class="bars">${r.bars.map(([l,p,txt])=>`<div class="bar-row"><span>${esc(l)}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,p||0))}%"></i></div><span class="num">${esc(txt||'')}</span></div>`).join('')}</div>`;
  if(r.table)h+=`<div class="tbl-wrap"><table><thead><tr>${r.table.h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${r.table.r.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(r.note)h+=`<p class="rnote">${esc(r.note)}</p>`;
  return h;
}
function resText(t,r){if(!r||r.err)return t.n;const L=[`ذِهن · ${t.n}`];if(r.big)L.push(`${r.big[0]}: ${r.big[1]}${r.big[2]?' ('+r.big[2]+')':''}`);(r.rows||[]).forEach(([l,v])=>L.push(`${l}: ${v}`));const u=shareURL(t.id);if(u)L.push(u);return L.join('\n');}
function formTool(el,t){
  const saved=S.inputs[t.id]||{};
  el.innerHTML=`${t.f.length?`<form class="card" id="tform" autocomplete="off" novalidate><div class="fgrid">${t.f.map(f=>fieldHTML(f,saved[f.k]!==undefined?saved[f.k]:defVal(f))).join('')}</div></form>`:''}
    <section class="card result" id="tres" aria-live="polite"></section>
    <div class="btn-row"><button class="btn" id="copyRes">${ic('copy')}انسخ النتيجة</button>${t.f.length?'<button class="btn ghost" id="resetF">القيم الافتراضية</button>':''}</div>`;
  const form=$('#tform',el);
  const compute=persist=>{const raw={};t.f.forEach(f=>{raw[f.k]=form.elements[f.k].value;});if(persist&&t.f.length){S.inputs[t.id]=raw;save();}
    const v=parseVals(t,raw);t.f.forEach(f=>{if(f.when)$('#w_'+f.k,el).hidden=!f.when(v);});
    let r;try{r=t.calc(v);}catch(e){r={err:'تعذّر الحساب، راجع القيم المدخلة.'};}
    $('#tres',el).innerHTML=resHTML(r);LAST={t,r};};
  if(form){form.addEventListener('input',()=>compute(true));form.addEventListener('change',()=>compute(true));form.addEventListener('submit',e=>e.preventDefault());}
  $('#copyRes',el).onclick=()=>copyText(resText(t,LAST&&LAST.r));
  const rb=$('#resetF',el);if(rb)rb.onclick=()=>{delete S.inputs[t.id];save();formTool(el,t);toast('أُعيدت القيم الافتراضية');};
  compute(false);
  if(t.live){clearInterval(liveT);liveT=setInterval(()=>compute(false),1000);}
}

/* ================= HOME ================= */
let UIc='all',UIq='';
const isFav=id=>S.fav.includes(id);
function toggleFav(id){const i=S.fav.indexOf(id);if(i>=0)S.fav.splice(i,1);else S.fav.push(id);save();toast(i>=0?'أُزيلت من المفضلة':'أُضيفت إلى المفضلة');}
function rowHTML(t){const c=catOf(t);return `<div class="trow"><a class="tlink" href="${t.href?esc(t.href):'#'+t.id}"><span class="tic ${t.c==='fun'?'fun':''}">${ic(c.icon)}</span><span class="tt"><b>${t.n}</b><small>${t.d}</small>${t.href?`<span class="ext">${ic('ext')}صفحة المسابقات</span>`:''}</span></a><button class="star" data-fav="${t.id}" aria-pressed="${isFav(t.id)}" aria-label="${isFav(t.id)?'إزالة من':'إضافة إلى'} المفضلة: ${t.n}">${ic('star')}</button></div>`;}
function renderHome(){
  document.title='ذِهن';
  $('#view').innerHTML=`<section class="hero"><h1>أدوات وحاسبات <span>لكل يوم</span></h1>
    <p>${TOOLS.length} أداة عربية مجانية: حاسبات العمر والهجري، القروض والزكاة، الصحة والحمل، تحويل الوحدات، ومسابقات واختبارات ممتعة. كل شيء يعمل على جهازك دون تسجيل.</p>
    <div class="search">${ic('search')}<input id="q" type="search" placeholder="ابحث: العمر، القرض، الوزن، رمضان…" value="${esc(UIq)}" aria-label="ابحث عن أداة"></div></section>
    <div class="chips" id="chips" role="group" aria-label="الأقسام"></div><div id="list"></div>`;
  $('#q').addEventListener('input',e=>{UIq=e.target.value;renderList();});
  renderChips();renderList();
}
function renderChips(){
  const ch=[['all','الكل',TOOLS.length],['fav','المفضلة',S.fav.length]].concat(CATS.map(c=>[c.id,c.n,TOOLS.filter(t=>t.c===c.id).length]));
  $('#chips').innerHTML=ch.map(([k,l,n])=>`<button class="chip" data-cat="${k}" aria-pressed="${UIc===k}">${l}<small class="num">${n}</small></button>`).join('');
}
function renderList(){
  const L=$('#list');if(!L)return;const q=norm(UIq.trim());
  if(q){const words=q.split(/\s+/);const res=TOOLS.filter(t=>{const hay=norm(t.n+' '+t.d+' '+(t.kw||'')+' '+catOf(t).n);return words.every(w=>hay.includes(w));});
    L.innerHTML=`<div class="sec"><div class="sec-h"><h2>نتائج البحث</h2><span class="num">${res.length}</span></div>${res.length?`<div class="tlist">${res.map(rowHTML).join('')}</div>`:`<div class="card empty">لا توجد أداة بهذا الاسم. جرّب كلمة أخرى مثل «قسط» أو «هجري».</div>`}</div>`;return;}
  if(UIc==='fav'){const f=S.fav.map(id=>TOOLS.find(t=>t.id===id)).filter(Boolean);
    L.innerHTML=`<div class="sec"><div class="sec-h"><h2>المفضلة</h2></div>${f.length?`<div class="tlist">${f.map(rowHTML).join('')}</div>`:`<div class="card empty">اضغط النجمة بجانب أي أداة لتظهر هنا وتصل إليها بسرعة.</div>`}</div>`;return;}
  let h='';
  if(UIc==='all'&&S.rec.length){const r=S.rec.map(id=>TOOLS.find(t=>t.id===id)).filter(Boolean).slice(0,4);if(r.length)h+=`<div class="sec"><div class="sec-h"><h2>استخدمتها مؤخرًا</h2></div><div class="tlist">${r.map(rowHTML).join('')}</div></div>`;}
  CATS.filter(c=>UIc==='all'||UIc===c.id).forEach(c=>{const ts=TOOLS.filter(t=>t.c===c.id);h+=`<div class="sec"><div class="sec-h"><h2>${c.n}</h2><span class="num">${ts.length} أداة</span></div><div class="tlist">${ts.map(rowHTML).join('')}</div></div>`;});
  L.innerHTML=h;
}

/* ================= TOOL PAGE ================= */
function renderTool(t){
  const c=catOf(t);document.title=t.n+' | ذِهن';
  S.rec=[t.id].concat(S.rec.filter(x=>x!==t.id)).slice(0,8);save();
  const rel=TOOLS.filter(x=>x.c===t.c&&x.id!==t.id).slice(0,8);
  $('#view').innerHTML=`<div class="thead"><a class="icon-btn" href="#" aria-label="رجوع إلى كل الأدوات">${ic('back')}</a><span class="crumb">${c.n}</span><button class="star" data-fav="${t.id}" aria-pressed="${isFav(t.id)}" aria-label="المفضلة">${ic('star')}</button></div>
    <h1 class="ttl">${t.n}</h1><p class="tdesc">${t.d}</p><div id="tbody" style="margin-top:14px"></div>
    ${t.how?`<details class="card how"><summary>كيف نحسبها؟</summary><p>${t.how}</p></details>`:''}
    ${rel.length?`<div class="related"><div class="sec-h"><h2>أدوات مشابهة</h2></div><div class="rel-chips">${rel.map(x=>`<a href="${x.href?esc(x.href):'#'+x.id}">${x.n}</a>`).join('')}</div></div>`:''}`;
  const body=$('#tbody');
  if(t.custom)t.custom(body,t);else if(t.unit)unitTool(body,t);else formTool(body,t);
}

/* ================= ROUTER, NAV, THEME ================= */
function route(){
  clearInterval(liveT);liveT=null;
  const h=decodeURIComponent(location.hash.slice(1));
  const v=$('#view');v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade');
  if(h==='fav'){UIc='fav';UIq='';renderHome();}
  else{const t=TOOLS.find(x=>x.id===h&&!x.href);if(t)renderTool(t);else{if(h==='')UIc=UIc==='fav'?'all':UIc;renderHome();}}
  window.scrollTo(0,0);renderNav(h);
}
function renderNav(h){
  const items=[['','grid','كل الأدوات'],['age','cake','حساب العمر'],['love','heart','مقياس الحب'],['quizzes/index.html','quiz','اختبر نفسك'],['fav','star','المفضلة']];
  $('#navIn').innerHTML=items.map(([k,i,l])=>{const href=k.includes('/')?k:'#'+k;const cur=(k===''&&(h===''||!TOOLS.some(t=>t.id===h)&&h!=='fav'))||k===h;return `<a href="${href}" ${cur?'aria-current="page"':''}>${ic(i)}<span>${l}</span></a>`;}).join('');
}
const hostTheme=document.documentElement.getAttribute('data-theme');
function effectiveDark(){const a=document.documentElement.getAttribute('data-theme');if(a)return a==='dark';try{return matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return false;}}
function applyTheme(){const r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.setAttribute('data-theme',S.theme);else if(hostTheme)r.setAttribute('data-theme',hostTheme);else r.removeAttribute('data-theme');$('#themeBtn').innerHTML=ic(effectiveDark()?'sun':'moon');}
$('#themeBtn').onclick=()=>{S.theme=effectiveDark()?'light':'dark';save();applyTheme();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}

document.addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]');if(f){e.preventDefault();toggleFav(f.dataset.fav);f.setAttribute('aria-pressed',isFav(f.dataset.fav));if($('#chips'))renderChips();if(UIc==='fav'&&$('#list'))renderList();return;}
  const c=e.target.closest('[data-cat]');if(c){UIc=c.dataset.cat;UIq='';const q=$('#q');if(q)q.value='';renderChips();renderList();if(UIc==='fav'&&location.hash!=='#fav')history.replaceState(null,'','#fav');else if(UIc!=='fav'&&location.hash==='#fav')history.replaceState(null,'',location.pathname+location.search);renderNav(UIc==='fav'?'fav':'');}
});
window.addEventListener('hashchange',route);
applyTheme();route();
})();
</script>
</body>
