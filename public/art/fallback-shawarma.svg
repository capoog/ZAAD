<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2a1e16"/>
      <stop offset="0.55" stop-color="#18120e"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a45" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="overlay"/>
    </filter>
    
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="400" cy="358" rx="360" ry="240" fill="url(#glow)"/>
  <g opacity="0.07" filter="url(#soft)">
    <path d="M60 120 C 200 60, 320 150, 470 90 S 700 60, 780 110" stroke="#d6c9b8" stroke-width="40" fill="none"/>
  </g>
  <g transform="translate(400 318) scale(1.16) translate(-400 -318)">
    <ellipse cx="400" cy="468" rx="300" ry="56" fill="url(#shadow)"/>
    
  
  <ellipse cx="400" cy="332" rx="270" ry="140" fill="#221d19"/>
  <ellipse cx="400" cy="318" rx="270" ry="140" fill="#3a322b"/>
  <ellipse cx="400" cy="324" rx="210.6" ry="106.4" fill="#2a241f"/>
  <g transform="translate(400 310)" opacity="0.9">
  <path d="M-150 30 C -120 -40, 120 -40, 150 30 C 100 70, -100 70, -150 30 Z" fill="#e3c08a"/>
  <path d="M-120 20 C -90 -20, 90 -20, 120 20" stroke="#a8561f" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M-100 34 C -70 6, 70 6, 100 34" stroke="#5f8f2f" stroke-width="8" stroke-linecap="round" fill="none"/></g>
  </g>
  <rect width="800" height="600" fill="transparent" filter="url(#grain)"/>
</svg>
