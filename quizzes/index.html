<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ذِهن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ذِهن: مسابقات ثقافية عربية بأوضاع لعب متعددة، تحدٍّ يومي، اختبارات شخصية، وصانع مسابقات خاص بك.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one-column game shell (max 680px) with a sticky top bar and fixed bottom tabs; the play screen puts a saffron countdown ring over a single question tile. */
:root{
  --bg:#E8EEF3; --surface:#FFFFFF; --surface-2:#DCE6EE; --line:#C6D4DF;
  --ink:#0F2436; --ink-dim:#4A6074; --ink-faint:#7D92A4;
  --brand:#12466D; --brand-ink:#FFFFFF; --brand-soft:#D2E3F0;
  --accent:#EFAA12; --accent-ink:#2E2100; --accent-soft:#FBE9BD;
  --ok:#17905F; --ok-soft:#D3F0E2; --bad:#CC3D3D; --bad-soft:#F8DADA; --on-signal:#FFFFFF;
  --shadow:0 1px 2px rgba(15,36,54,.08),0 12px 28px -16px rgba(15,36,54,.4);
  --f-display:'Lalezar','Readex Pro',Tahoma,sans-serif;
  --f-body:'Readex Pro',Tahoma,'Segoe UI',Arial,sans-serif;
  --r-l:22px; --r-m:14px; --r-s:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1622; --surface:#112131; --surface-2:#192D40; --line:#244259;
    --ink:#E6EEF5; --ink-dim:#9CB1C3; --ink-faint:#6C8398;
    --brand:#5AAEE3; --brand-ink:#061320; --brand-soft:#163650;
    --accent:#F6C247; --accent-ink:#271C00; --accent-soft:#3A3013;
    --ok:#3DCB8F; --ok-soft:#113A2A; --bad:#FF6E6E; --bad-soft:#41191C; --on-signal:#06140E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1622; --surface:#112131; --surface-2:#192D40; --line:#244259;
  --ink:#E6EEF5; --ink-dim:#9CB1C3; --ink-faint:#6C8398;
  --brand:#5AAEE3; --brand-ink:#061320; --brand-soft:#163650;
  --accent:#F6C247; --accent-ink:#271C00; --accent-soft:#3A3013;
  --ok:#3DCB8F; --ok-soft:#113A2A; --bad:#FF6E6E; --bad-soft:#41191C; --on-signal:#06140E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

#app{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;background:var(--bg)}
.logo{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--brand);display:flex;align-items:baseline;gap:4px;background:none;border:0;padding:0}
.logo i{width:9px;height:9px;background:var(--accent);border-radius:2px;transform:rotate(45deg);display:inline-block}
.top-actions{display:flex;gap:6px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-dim)}
.icon-btn:hover{color:var(--brand)}
.stack{display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.2}
.sec-h span{color:var(--ink-faint);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:18px}
.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* level strip */
.lvl{display:flex;align-items:center;gap:14px}
.lvl-badge{width:58px;height:58px;flex:none;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;line-height:1}
.lvl-body{flex:1;min-width:0}
.lvl-title{font-weight:700;font-size:17px}
.lvl-title small{font-weight:400;color:var(--ink-faint);font-size:13px;margin-inline-start:6px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-block:6px 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.mini div{background:var(--surface-2);border-radius:var(--r-s);padding:8px 10px;text-align:center}
.mini b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2;color:var(--ink)}
.mini span{font-size:12px;color:var(--ink-dim)}

/* daily */
.daily{background:var(--brand);color:var(--brand-ink);border-radius:var(--r-l);padding:20px;position:relative;overflow:hidden}
.daily::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:150px;height:150px;border:22px solid var(--accent);border-radius:50%;opacity:.35}
.daily .eyebrow{font-size:12px;letter-spacing:.06em;opacity:.85}
.daily h3{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin-block:4px 6px}
.daily p{opacity:.9;max-width:40ch;font-size:14px}
.daily .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px;position:relative;z-index:1}
.daily .grid-emoji{font-size:20px;letter-spacing:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 18px;font-weight:600;font-size:15px;line-height:1.2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.link{background:none;border:0;padding:4px;color:var(--brand);font-weight:600;font-size:14px}
.link.danger{color:var(--bad)}

/* modes */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:540px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:10px 12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.mode b{font-size:15px}
.mode span{font-size:12px;color:var(--ink-faint)}
.mode[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.mode[aria-pressed="true"] span{color:var(--brand-ink);opacity:.8}
.mode-desc{margin-top:10px;font-size:13px;color:var(--ink-dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}

/* categories */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:14px;text-align:start;display:flex;flex-direction:column;gap:10px;min-width:0;transition:transform .15s ease,border-color .15s ease}
.cat:hover{border-color:var(--brand);transform:translateY(-2px)}
.cat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.cat .ic .glyph{font-family:var(--f-display);font-size:26px;line-height:1}
.cat b{font-size:16px;display:block}
.cat small{color:var(--ink-faint);font-size:12px}
.cat.mix{background:var(--accent-soft);border-color:var(--accent)}
.cat.mix .ic{background:var(--accent);color:var(--accent-ink)}
.review-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start}

/* play */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
.hearts{display:flex;gap:2px;color:var(--bad)}
.hearts svg{width:22px;height:22px}
.hearts .off{color:var(--line)}
.pscore{text-align:end;line-height:1.1}
.pscore b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--brand);display:block}
.pscore span{font-size:12px;color:var(--ink-faint)}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s ease}
.turn{margin-top:12px;border-radius:var(--r-m);padding:8px 14px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.turn.t0{background:var(--brand-soft)}
.turn.t1{background:var(--accent-soft)}
.qhead{display:flex;align-items:center;gap:14px;margin-top:18px}
.ring{position:relative;width:68px;height:68px;flex:none}
.ring svg{width:68px;height:68px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:var(--surface-2)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .1s linear}
.ring.low .val{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--ink)}
.qinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.qcat{font-size:13px;color:var(--ink-dim)}
.diff{font-size:12px;color:var(--ink-faint)}
.combo{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-size:14px}
.combo svg{width:18px;height:18px}
.qtext{font-size:clamp(1.2rem,4.6vw,1.6rem);font-weight:600;line-height:1.5;margin-block:16px 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:start;font-size:16px;transition:border-color .15s ease,background .15s ease,opacity .2s}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt .ol{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-display);font-size:19px;line-height:1}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .ol{background:var(--ok);color:var(--on-signal)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt.wrong .ol{background:var(--bad);color:var(--on-signal)}
.opt.dim{opacity:.5}
.opt.gone{opacity:.18}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.helps{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.help{flex:1;min-width:90px;border:1px dashed var(--line);background:transparent;border-radius:12px;padding:8px;font-size:13px;font-weight:600;color:var(--ink-dim)}
.help:not(:disabled):hover{border-color:var(--accent);color:var(--ink)}
.help:disabled{opacity:.35;text-decoration:line-through}
.exp{margin-top:16px;border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:8px}
.exp.ok{background:var(--ok-soft)}
.exp.bad{background:var(--bad-soft)}
.exp-h{font-weight:700;font-size:17px}
.exp.ok .exp-h{color:var(--ok)}
.exp.bad .exp-h{color:var(--bad)}
.exp p{color:var(--ink-dim);font-size:14px}
.exp .btn{margin-top:6px;align-self:flex-start}
.kbd{font-size:12px;color:var(--ink-faint);margin-top:14px;text-align:center}

/* result */
.res-hero{text-align:center;padding-block:10px 4px}
.res-hero .big{font-family:var(--f-display);font-size:72px;line-height:1;color:var(--brand)}
.res-hero h1{font-family:var(--f-display);font-weight:400;font-size:32px;margin-top:6px}
.res-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.res-stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px;text-align:center}
.res-stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
.res-stats span{font-size:12px;color:var(--ink-dim)}
.emoji-grid{font-size:22px;letter-spacing:3px;text-align:center;overflow-wrap:anywhere;line-height:1.5}
.unlock{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.unlock span{background:var(--accent-soft);border:1px solid var(--accent);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600}
.winner{text-align:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r-l);padding:18px}
.winner b{font-family:var(--f-display);font-weight:400;font-size:30px;display:block}
.rev-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.rev{border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--surface)}
.rev .rq{font-weight:600}
.rev .ra{font-size:14px;margin-top:4px}
.rev .ra.ok{color:var(--ok)}
.rev .ra.bad{color:var(--bad)}
.rev .re{font-size:13px;color:var(--ink-dim);margin-top:4px}
details summary{cursor:pointer;font-weight:600;color:var(--brand);padding-block:4px}

/* persona */
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:flex;gap:14px;align-items:center;text-align:start;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-l);padding:16px}
.pcard .ic{width:52px;height:52px;flex:none;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:28px}
.pcard b{display:block;font-size:17px}
.pcard small{color:var(--ink-faint)}
.pcard .done{color:var(--ok);font-size:13px;font-weight:600}
.pres{text-align:center}
.pres .type{font-family:var(--f-display);font-size:40px;color:var(--brand);line-height:1.2}
.pbars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pbar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:10px;align-items:center;font-size:14px}
.pbar .bar{margin:0}

/* make */
.qlist{display:flex;flex-direction:column;gap:10px}
.qitem{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.qitem .t{min-width:0;flex:1}
.qitem .t b{display:block;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;background:var(--surface-2);border-radius:6px;padding:1px 7px;color:var(--ink-dim);margin-inline-start:6px;vertical-align:middle}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 12px;font-size:15px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{resize:vertical;min-height:70px}
.qblock{display:flex;flex-direction:column;gap:8px}
.qb-h{display:flex;justify-content:space-between;align-items:center}
.eopt{display:flex;gap:8px;align-items:center}
.eopt input[type=radio]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.err{color:var(--bad);font-size:14px;font-weight:600}

/* stats */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:540px){.sgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sgrid div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px}
.sgrid b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2}
.sgrid span{font-size:12px;color:var(--ink-dim)}
.cbar{display:grid;grid-template-columns:6.5em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:14px;padding-block:5px}
.cbar .bar{margin:0}
.cbar .bar i{background:var(--brand)}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:540px){.achs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ach{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-m);padding:10px;background:var(--surface);min-width:0}
.ach .md{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.ach.locked{opacity:.5}
.ach.locked .md{background:var(--surface-2);color:var(--ink-faint)}
.ach b{display:block;font-size:14px}
.ach small{font-size:12px;color:var(--ink-dim);display:block;line-height:1.4}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:99px;border:0;background:var(--surface-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:inset-inline-start .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{inset-inline-start:25px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* nav, toast, sheet */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;color:var(--ink-faint);border-radius:12px}
.nav button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(5,15,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:var(--r-l);padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet textarea{min-height:120px;font-size:13px}
.empty{text-align:center;color:var(--ink-dim);padding:24px 10px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* sound */
let AC=null;
function beep(freqs,dur=.1,type='sine',vol=.07){
  if(!S.settings.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
    freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      const s=t0+i*dur;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(vol,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+dur+.03);});
  }catch(e){}
}

/* ================= GAME ================= */
function dailyItems(){
  const rnd=mulberry32(hashStr('dhihn-'+todayKey()));
  return shuffle(CATS,rnd).slice(0,5).map(c=>{const pool=BANK.filter(b=>b.cat===c.id);return pool[Math.floor(rnd()*pool.length)];});
}
function customItems(qz){
  return qz.qs.map((x,i)=>({id:'c-'+qz.id+'-'+i,cat:'custom',q:x.q,o:[x.o[x.a]].concat(x.o.filter((_,j)=>j!==x.a)),d:0,e:''}));
}
function startGame(cfg){
  const mode=cfg.mode,m=MODES[mode];
  let queue,pool,title;
  if(mode==='daily'){queue=dailyItems();title='تحدّي اليوم';}
  else if(mode==='review'){queue=shuffle(BANK.filter(b=>S.wrong.includes(b.id))).slice(0,10);title='مراجعة الأخطاء';}
  else if(mode==='custom'){const qz=S.quizzes.find(q=>q.id===cfg.quizId);if(!qz)return;queue=shuffle(customItems(qz));title=qz.title;}
  else{
    const base=cfg.cat==='mix'?BANK:BANK.filter(b=>b.cat===cfg.cat);
    const f=UI.diff?base.filter(b=>b.d===UI.diff):base;
    pool=f.length?f:base;
    queue=shuffle(pool);
    if(Number.isFinite(m.n)&&queue.length<m.n){queue=queue.concat(shuffle(base.filter(b=>!pool.includes(b))));if(UI.diff)toast('لا تكفي أسئلة بهذه الصعوبة، فأكملناها بأسئلة أخرى');}
    title=cfg.cat==='mix'?'خليط عشوائي':catById(cfg.cat).name;
  }
  if(!queue.length){toast('لا توجد أسئلة متاحة');return;}
  const n=mode==='review'||mode==='custom'?queue.length:m.n;
  G={mode,m,cfg,title,queue,pool:pool||queue.slice(),n,endless:!Number.isFinite(n),idx:0,log:[],ps:[0,0],pc:[0,0],streak:[0,0],best:0,correct:0,score:0,
     lives:3,help:{fifty:m.help,time:m.help,skip:m.help},usedHelp:false,fast:false,players:cfg.players||null,rushEnd:0,locked:false,extra:0};
  if(mode==='rush')G.rushEnd=performance.now()+60000;
  UI.screen='play';
  nextQ();
}
function drawItem(){
  if(!G.queue.length&&G.endless)G.queue=shuffle(G.pool);
  return G.queue.shift();
}
function nextQ(){
  G.cur=drawItem();
  if(!G.cur){endGame();return;}
  G.order=shuffle([0,1,2,3]);G.ci=G.order.indexOf(0);
  G.locked=false;G.extra=0;G.lastTickS=null;G.qStart=performance.now();
  if(G.mode!=='rush')G.qEnd=G.qStart+G.m.t*1000;
  render();startTimer();
}
function startTimer(){clearInterval(TICK);TICK=setInterval(tick,100);tick();}
function tick(){
  if(!G){clearInterval(TICK);return;}
  const now=performance.now();let rem,total;
  if(G.mode==='rush'){rem=(G.rushEnd-now)/1000;total=60;if(rem<=0){drawRing(0,total);endGame();return;}}
  else{if(G.locked)return;rem=(G.qEnd-now)/1000;total=G.m.t+G.extra;if(rem<=0){drawRing(0,total);answer(-1);return;}}
  drawRing(rem,total);
  const s=Math.ceil(rem);if(s<=5&&s!==G.lastTickS){G.lastTickS=s;SND.tick();}
}
const RC=2*Math.PI*29;
function drawRing(rem,total){
  const ring=$('#ring');if(!ring)return;
  const f=Math.max(0,Math.min(1,rem/total));
  $('#ringVal').style.strokeDashoffset=String(RC*(1-f));
  $('#tnum').textContent=Math.max(0,Math.ceil(rem));
  ring.classList.toggle('low',rem<=5);
}
function curPlayer(){return G.mode==='duel'?G.idx%2:0;}
function renderPlay(){
  if(!G)return '';
  const it=G.cur,p=curPlayer();
  let meta;
  if(G.mode==='survival')meta=`<span class="hearts" aria-label="القلوب المتبقية ${G.lives}">${[0,1,2].map(i=>`<span class="${i<G.lives?'':'off'}">${ic('heart')}</span>`).join('')}</span>`;

    <div class="qhead">

  </div>`;

function answer(k){
  if(!G||G.locked)return;
  G.locked=true;
  const now=performance.now(),it=G.cur,ok=k===G.ci,p=curPlayer(),t=(now-G.qStart)/1000;
  let pts=0;
  if(ok){
    G.streak[p]++;G.best=Math.max(G.best,G.streak[p]);
    const st=G.streak[p],mult=st>=6?2:st>=3?1.5:1;
    const rem=G.mode==='rush'?0:Math.max(0,(G.qEnd-now)/1000);
    pts=Math.round((100+Math.ceil(rem)*5)*mult);
    G.ps[p]+=pts;G.pc[p]++;G.correct++;
    if(t<2)G.fast=true;
    if(G.mode==='rush')G.rushEnd+=2000;
    SND.ok();
  }else{
    G.streak[p]=0;SND.bad();vibrate(70);
    if(G.mode==='survival')G.lives--;
    if(G.mode==='rush')G.rushEnd-=3000;
  }
  G.score=G.ps[0]+G.ps[1];
  G.log.push({it,order:G.order,chosen:k,ci:G.ci,ok,p,pts});
  $$('.opt').forEach((b,i)=>{b.disabled=true;if(i===G.ci)b.classList.add('right');else if(i===k)b.classList.add('wrong');else b.classList.add('dim');});
  const sc=$('#score');if(sc)sc.textContent=G.score;
  const st=G.streak[p],mult=st>=6?2:st>=3?1.5:1,cb=$('#combo');if(cb)cb.innerHTML=mult>1?`${ic('flame')} سلسلة ${st} · ×${mult}`:'';
  if(G.mode==='survival'){const h=$('.hearts');if(h)h.innerHTML=[0,1,2].map(i=>`<span class="${i<G.lives?'':'off'}">${ic('heart')}</span>`).join('');}
  if(G.mode==='rush'){const pl=$('.ptop .pill');if(pl)pl.textContent=G.correct+' صحيحة';
    setTimeout(()=>{if(G&&G.mode==='rush'&&performance.now()<G.rushEnd){G.idx++;nextQ();}},ok?420:700);return;}
  const helps=$('#helps');if(helps)helps.hidden=true;
  const last=G.mode==='survival'?G.lives<=0:G.idx+1>=G.n;
  let head=ok?`إجابة صحيحة! +${pts}`:k===-1?'انتهى الوقت':'إجابة خاطئة';
  if(G.mode==='survival'&&!ok)head+=G.lives>0?` · بقي ${G.lives===1?'قلب واحد':'قلبان'}`:' · نفدت القلوب';
  const nextLbl=last?'عرض النتيجة':G.mode==='duel'?`التالي: دور ${esc(G.players[(G.idx+1)%2])}`:'السؤال التالي';
  $('#explain').innerHTML=`<div class="exp ${ok?'ok':'bad'}" role="status">
    <div class="exp-h">${head}</div>
    ${ok?'':`<div>الإجابة الصحيحة: <b>${esc(it.o[0])}</b></div>`}
    ${it.e?`<p>${esc(it.e)}</p>`:''}
    <button class="btn primary" data-act="next" id="nextBtn">${nextLbl}</button></div>`;
  const nb=$('#nextBtn');if(nb){nb.focus({preventScroll:true});nb.scrollIntoView({block:'nearest',behavior:'smooth'});}
}
function nextStep(){
  if(!G||!G.locked)return;
  const end=G.mode==='survival'?G.lives<=0:G.idx+1>=G.n;
  G.idx++;
  if(end)endGame();else nextQ();
}
function useHelp(h){
  if(!G||G.locked||!G.help[h])return;
  G.help[h]=false;G.usedHelp=true;SND.click();
  if(h==='fifty'){
    const wrongs=shuffle([0,1,2,3].filter(i=>i!==G.ci)).slice(0,2);
    wrongs.forEach(i=>{const b=$('#opt'+i);b.disabled=true;b.classList.add('gone');});
  }else if(h==='time'){G.qEnd+=10000;G.extra+=10;}
  else if(h==='skip'){
    clearInterval(TICK);
    const needed=G.n-G.idx-1;
    if(G.endless||G.queue.length>needed){nextQ();}
    else{G.log.push({it:G.cur,order:G.order,chosen:-2,ci:G.ci,ok:false,skipped:true,p:0,pts:0});G.idx++;if(G.idx>=G.n)endGame();else nextQ();}
    return;
  }
  const b=$(`[data-h="${h}"]`);if(b)b.disabled=true;
}
function endGame(){
  clearInterval(TICK);
  const g=G;G=null;
  const ans=g.log.filter(x=>!x.skipped),total=ans.length,correct=g.correct;
  const lvBefore=levelInfo(S.xp).level;
  const newly=[];const unlock=id=>{if(!S.ach[id]){S.ach[id]=Date.now();newly.push(id);}};
  let fixedNow=0;
  if(g.mode!=='duel'){
    S.answered+=total;S.correct+=correct;
    ans.forEach(x=>{
      if(x.it.cat==='custom')return;
      const c=S.cats[x.it.cat]||(S.cats[x.it.cat]={a:0,c:0});c.a++;if(x.ok)c.c++;
      const wi=S.wrong.indexOf(x.it.id);
      if(x.ok){if(wi>=0){S.wrong.splice(wi,1);if(g.mode==='review')fixedNow++;}}
      else if(wi<0)S.wrong.push(x.it.id);
    });
  }
  S.games++;S.bestStreak=Math.max(S.bestStreak,g.best);
  S.fixed=(S.fixed||0)+fixedNow;
  const perfect=g.mode==='classic'&&correct===10;
  let xp=g.mode==='duel'?correct*5:correct*10+(perfect?50:0)+Math.floor(g.best/5)*10;
  if(g.mode==='daily'){
    xp+=30;const tk=todayKey();
    if(S.daily.last!==tk){S.daily.streak=S.daily.last===yesterdayKey()?(S.daily.streak||0)+1:1;S.daily.last=tk;}
    S.daily.results[tk]={score:g.score,correct,total:g.n,grid:g.log.map(x=>x.ok?'🟩':'🟥').join('')};
    const keys=Object.keys(S.daily.results).sort();if(keys.length>40)keys.slice(0,keys.length-40).forEach(k=>delete S.daily.results[k]);
    unlock('daily');if(S.daily.streak>=3)unlock('daily3');
  }
  S.xp+=xp;
  const prevBest=S.best[g.mode]||0;
  if(['classic','rush','survival'].includes(g.mode))S.best[g.mode]=Math.max(prevBest,g.mode==='classic'?g.score:correct);
  unlock('first');
  if(perfect)unlock('perfect');
  if(g.best>=5)unlock('s5');
  if(g.best>=10)unlock('s10');
  if(g.fast)unlock('fast');
  if(g.mode==='survival'&&correct>=15)unlock('surv');
  if(g.mode==='rush'&&correct>=12)unlock('rush');
  if(g.mode==='classic'&&!g.usedHelp&&correct>=8)unlock('nohelp');
  if(g.mode==='duel')unlock('duel');
  if(CATS.every(c=>S.cats[c.id]&&S.cats[c.id].a))unlock('allcats');
  if(S.fixed>=5)unlock('review');
  if(levelInfo(S.xp).level>=5)unlock('lvl5');
  save();
  const lvAfter=levelInfo(S.xp).level;
  R={g,total,correct,xp,newly,levelUp:lvAfter>lvBefore?lvAfter:0,newBest:['classic','rush','survival'].includes(g.mode)&&(g.mode==='classic'?g.score:correct)>prevBest&&prevBest>0};
  SND.win();
  UI.screen='result';render();window.scrollTo(0,0);
  if(R.levelUp)toast(`مستوى جديد: ${levelInfo(S.xp).title} (${lvAfter})`,3000);
}
function resultText(){
  const g=R.g,grid=g.log.slice(0,30).map(x=>x.skipped?'⬜':x.ok?'🟩':'🟥').join('');
  let line;
  if(g.mode==='duel'){line=`${g.players[0]} ${g.ps[0]} · ${g.ps[1]} ${g.players[1]}`;}

  const head=g.mode==='daily'?`ذِهن · تحدّي اليوم ${todayKey()}`:`ذِهن · ${g.title} (${g.m.name})`;
  const u=shareURL();
  return `${head}\n${grid}\n${line}${u?'\n'+u:''}`;
}

function encodeQuiz(qz){const j=JSON.stringify({t:qz.title,q:qz.qs.map(x=>[x.q,x.o,x.a])});return 'DHN1:'+btoa(unescape(encodeURIComponent(j)));}
function decodeQuiz(code){
  const m=String(code).trim().match(/DHN1:([A-Za-z0-9+/=]+)/);if(!m)return null;
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(!o||typeof o.t!=='string'||!Array.isArray(o.q)||!o.q.length||o.q.length>50)return null;
    const qs=o.q.map(x=>({q:String(x[0]).slice(0,300),o:(Array.isArray(x[1])?x[1]:[]).slice(0,4).map(s=>String(s).slice(0,120)),a:Math.max(0,Math.min(3,parseInt(x[2],10)||0))}));
    if(qs.some(x=>!x.q.trim()||x.o.length!==4||x.o.some(s=>!s.trim())))return null;
    return{id:'q'+Date.now().toString(36),title:o.t.slice(0,60)||'مسابقة مستوردة',created:Date.now(),qs};
  }catch(e){return null;}
}

    <div class="field"><label for="eTitle">اسم المسابقة</label><input type="text" id="eTitle" data-e="title" maxlength="60" placeholder="مثال: معلومات عن عائلتنا" value="${esc(E.title)}"></div>
    ${E.qs.map((x,i)=>`<div class="card qblock">
      <div class="qb-h"><b>السؤال ${i+1}</b>${E.qs.length>1?`<button class="link danger" data-act="eDel" data-i="${i}">حذف</button>`:''}</div>
      <textarea id="eq${i}" data-e="q" data-i="${i}" maxlength="300" placeholder="اكتب السؤال">${esc(x.q)}</textarea>
      ${[0,1,2,3].map(j=>`<div class="eopt"><input type="radio" name="ea${i}" id="ea${i}_${j}" data-e="a" data-i="${i}" data-j="${j}" ${x.a===j?'checked':''} aria-label="الخيار ${j+1} هو الصحيح"><input type="text" id="eo${i}_${j}" data-e="o" data-i="${i}" data-j="${j}" maxlength="120" placeholder="الخيار ${j+1}" value="${esc(x.o[j])}"></div>`).join('')}
      <small class="faint">اختر الدائرة بجانب الإجابة الصحيحة.</small>
    </div>`).join('')}
    <button class="btn" data-act="eAdd" ${E.qs.length>=50?'disabled':''}>${ic('plus')}أضف سؤالًا</button>
    <div id="eErr" class="err" role="alert"></div>
    <button class="btn primary block" data-act="eSave">احفظ المسابقة</button>
  </div>`;
}

/* ================= STATS ================= */
function renderStats(){
  const lv=levelInfo(S.xp);
  const got=ACH.filter(a=>S.ach[a[0]]).length;
  return `<div class="stack">
    <div class="sec-h"><h2>إنجازاتي</h2><span>${lv.title} · المستوى ${lv.level}</span></div>
    <div class="sgrid">
      <div><b class="num">${S.xp}</b><span>نقطة خبرة</span></div>
      <div><b class="num">${S.games}</b><span>مسابقة</span></div>
      <div><b class="num">${pct(S.correct,S.answered)}%</b><span>دقة (${S.correct}/${S.answered})</span></div>
      <div><b class="num">${S.bestStreak}</b><span>أطول سلسلة</span></div>
      <div><b class="num">${S.best.classic||0}</b><span>أعلى نقاط كلاسيكي</span></div>
      <div><b class="num">${S.best.rush||0}</b><span>أفضل سباق دقيقة</span></div>
      <div><b class="num">${S.best.survival||0}</b><span>أفضل بقاء</span></div>
      <div><b class="num">${S.daily.streak||0}</b><span>أيام التحدّي المتتالية</span></div>
    </div>
    <section class="card">
      <div class="sec-h"><h2>دقتك في كل قسم</h2></div>
      ${CATS.map(c=>{const s=S.cats[c.id]||{a:0,c:0};return `<div class="cbar"><span>${c.name}</span><div class="bar"><i style="width:${pct(s.c,s.a)}%"></i></div><span class="num faint">${s.a?pct(s.c,s.a)+'%':'لم تلعب'}</span></div>`;}).join('')}
    </section>
    <section>
      <div class="sec-h"><h2>الأوسمة</h2><span class="num">${got} / ${ACH.length}</span></div>
      <div class="achs">${ACH.map(a=>`<div class="ach ${S.ach[a[0]]?'':'locked'}"><span class="md">${ic('medal')}</span><span style="min-width:0"><b>${a[1]}</b><small>${a[2]}</small></span></div>`).join('')}</div>
    </section>
  </div>`;
}

/* ================= SETTINGS ================= */
function renderSettings(){
  const t=S.settings.theme;
  return `<div class="stack">
    <div class="sec-h"><h2>الإعدادات</h2></div>
    <div class="card">
      <div class="set-row"><span><b>المؤثرات الصوتية</b><br><small class="faint">نغمات قصيرة عند الإجابة وآخر 5 ثوانٍ</small></span>
        <button class="switch" role="switch" aria-checked="${S.settings.sound}" aria-label="المؤثرات الصوتية" data-act="toggleSound"></button></div>
      <div class="set-row"><b>المظهر</b>
        <div class="seg" role="group" aria-label="المظهر">${[['auto','تلقائي'],['light','فاتح'],['dark','داكن']].map(([k,l])=>`<button data-act="theme" data-v="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div></div>
      <div class="set-row"><span><b>مسح كل البيانات</b><br><small class="faint">النقاط والإنجازات والمسابقات الخاصة على هذا الجهاز</small></span>
        <button class="btn danger" data-act="reset">${UI.resetArm?'اضغط مجددًا للتأكيد':'مسح'}</button></div>
    </div>
    <p class="faint">تُحفظ بياناتك في متصفحك على هذا الجهاز فقط، ولا تُرسل إلى أي خادم.</p>
  </div>`;
}

/* ================= ACTIONS ================= */
const ACT={
  go:el=>go(el.dataset.v),
  mode:el=>{UI.mode=el.dataset.v;S.settings.mode=UI.mode;save();render();},
  diff:el=>{UI.diff=+el.dataset.v;S.settings.diff=UI.diff;save();render();},
  cat:el=>{const c=el.dataset.v;if(UI.mode==='duel'){UI.pendingCat=c;go('duelsetup');}else startGame({mode:UI.mode,cat:c});},
  startDaily:()=>{if(S.daily.results[todayKey()]){toast('أنهيت تحدّي اليوم، عُد غدًا');return;}startGame({mode:'daily'});},
  copyDaily:()=>{const r=S.daily.results[todayKey()];if(!r)return;const u=shareURL();copyText(`ذِهن · تحدّي اليوم ${todayKey()}\n${r.grid}\n${r.correct}/${r.total} · ${r.score} نقطة${u?'\n'+u:''}`);},
  startReview:()=>{if(S.wrong.length)startGame({mode:'review'});},
  startDuel:()=>{const a=$('#p1').value.trim()||'اللاعب الأول',b=$('#p2').value.trim()||'اللاعب الثاني';S.settings.p1=$('#p1').value.trim();S.settings.p2=$('#p2').value.trim();save();startGame({mode:'duel',cat:UI.pendingCat,players:[a,b]});},
  ans:el=>answer(+el.dataset.k),
  next:()=>nextStep(),
  help:el=>useHelp(el.dataset.h),
  quit:el=>{if(UI.quitArm){clearInterval(TICK);G=null;go('home');return;}UI.quitArm=true;el.innerHTML='<b style="font-size:12px">خروج؟</b>';setTimeout(()=>{UI.quitArm=false;const b=$('#quitBtn');if(b)b.innerHTML=ic('x');},2500);},
  replay:()=>{if(R)startGame(R.g.cfg);},
  copyResult:()=>{if(R)copyText(resultText());},
  ptest:el=>{const t=PTESTS.find(x=>x.id===el.dataset.v);PT={t,i:0,counts:[0,0,0,0],order:shuffle([0,1,2,3])};UI.screen='ptest';render();window.scrollTo(0,0);},
  pans:el=>{PT.counts[+el.dataset.v]++;PT.i++;PT.order=shuffle([0,1,2,3]);SND.click();
    if(PT.i>=PT.t.qs.length){const best=PT.counts.indexOf(Math.max(...PT.counts));S.persona[PT.t.id]=best;if(!S.ach.persona){S.ach.persona=Date.now();toast('وسام جديد: اعرف نفسك');}save();SND.win();}
    render();window.scrollTo(0,0);},
  copyPersona:()=>{const best=PT.counts.indexOf(Math.max(...PT.counts)),u=shareURL();copyText(`ذِهن · ${PT.t.name}\nنتيجتي: ${PT.t.types[best][0]}\n${PT.t.types[best][1]}${u?'\n'+u:''}`);},
  newQuiz:()=>{E={id:null,title:'',qs:[blankQ(),blankQ(),blankQ()]};go('editor');},
  editQuiz:el=>{const q=S.quizzes.find(x=>x.id===el.dataset.v);if(!q)return;E={id:q.id,title:q.title,qs:q.qs.map(x=>({q:x.q,o:x.o.slice(),a:x.a}))};go('editor');},
  playQuiz:el=>startGame({mode:'custom',quizId:el.dataset.v}),
  shareQuiz:el=>{const q=S.quizzes.find(x=>x.id===el.dataset.v);if(q)copyText(`تحدَّني في مسابقة «${q.title}» على ذِهن! انسخ هذا الرمز والصقه في «اصنع مسابقة ← استيراد»:\n${encodeQuiz(q)}`);},
  delQuiz:el=>{const id=el.dataset.v;if(UI.delArm===id){S.quizzes=S.quizzes.filter(x=>x.id!==id);UI.delArm=null;save();render();toast('حُذفت المسابقة');}else{UI.delArm=id;render();setTimeout(()=>{if(UI.delArm===id&&UI.screen==='make'){UI.delArm=null;render();}},3000);}},
  importQuiz:()=>{const q=decodeQuiz($('#importCode').value);if(!q){toast('الرمز غير صالح. تأكد أنك نسخته كاملًا ويبدأ بـ DHN1:',3200);return;}S.quizzes.unshift(q);save();render();toast(`أُضيفت «${q.title}»`);},
  eAdd:()=>{E.qs.push(blankQ());render();const i=E.qs.length-1;const t=$('#eq'+i);if(t){t.focus();t.scrollIntoView({block:'center'});}},
  eDel:el=>{E.qs.splice(+el.dataset.i,1);render();},
  eSave:()=>{
    const err=$('#eErr');
    if(!E.title.trim()){err.textContent='اكتب اسمًا للمسابقة.';$('#eTitle').focus();return;}
    for(let i=0;i<E.qs.length;i++){const x=E.qs[i];
      if(!x.q.trim()){err.textContent=`السؤال ${i+1} فارغ.`;$('#eq'+i).focus();return;}
      const j=x.o.findIndex(s=>!s.trim());if(j>=0){err.textContent=`أكمل الخيار ${j+1} في السؤال ${i+1}.`;$(`#eo${i}_${j}`).focus();return;}
    }
    const clean={title:E.title.trim(),qs:E.qs.map(x=>({q:x.q.trim(),o:x.o.map(s=>s.trim()),a:x.a}))};
    if(E.id){const q=S.quizzes.find(x=>x.id===E.id);if(q){Object.assign(q,clean);delete q.sample;}}
    else S.quizzes.unshift(Object.assign({id:'q'+Date.now().toString(36),created:Date.now()},clean));
    if(!S.ach.maker)S.ach.maker=Date.now();
    save();go('make');toast('حُفظت المسابقة');
  },
  toggleSound:()=>{S.settings.sound=!S.settings.sound;save();render();if(S.settings.sound)SND.ok();},
  theme:el=>{S.settings.theme=el.dataset.v;save();applyTheme();render();},
  themeToggle:()=>{S.settings.theme=effectiveDark()?'light':'dark';save();applyTheme();if(UI.screen==='settings')render();},
  reset:()=>{if(!UI.resetArm){UI.resetArm=true;render();return;}
    try{localStorage.removeItem(LS);}catch(e){}S=defState();UI.resetArm=false;applyTheme();go('home');toast('مُسحت كل البيانات');},
  closeSheet:(el,ev)=>{if(ev.target===el){$('#sheet').hidden=true;$('#sheet').innerHTML='';}}
};

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el,ev);
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(!E||!el.dataset||!el.dataset.e)return;
  const i=+el.dataset.i,j=+el.dataset.j;
  if(el.dataset.e==='title')E.title=el.value;
  else if(el.dataset.e==='q')E.qs[i].q=el.value;
  else if(el.dataset.e==='o')E.qs[i].o[j]=el.value;
});
document.addEventListener('change',ev=>{
  const el=ev.target;if(E&&el.dataset&&el.dataset.e==='a')E.qs[+el.dataset.i].a=+el.dataset.j;
});
document.addEventListener('keydown',ev=>{
  if(ev.target.matches&&ev.target.matches('input,textarea'))return;
  const map={'1':0,'2':1,'3':2,'4':3,'١':0,'٢':1,'٣':2,'٤':3};
  if(UI.screen==='play'&&G){
    if(ev.key in map&&!G.locked){const b=$('#opt'+map[ev.key]);if(b&&!b.disabled){ev.preventDefault();answer(map[ev.key]);}}
    else if(ev.key==='Enter'&&G.locked&&$('#nextBtn')){ev.preventDefault();nextStep();}
  }else if(UI.screen==='ptest'&&PT&&ev.key in map&&PT.i<PT.t.qs.length){
    const b=$$('.opt')[map[ev.key]];if(b){ev.preventDefault();b.click();}
  }
  if(ev.key==='Escape'&&!$('#sheet').hidden){$('#sheet').hidden=true;}
});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
new MutationObserver(()=>{const b=$('#themeBtn');if(b)b.innerHTML=ic(effectiveDark()?'sun':'moonS');}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

$('#setBtn').innerHTML=ic('sliders');
$('#hubBtn').innerHTML=ic('grid');
{const h0=location.hash.slice(1);if(['persona','make','stats'].includes(h0))UI.screen=h0;}
applyTheme();
render();
})();
</script>
</body>
</html>
